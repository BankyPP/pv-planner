/* ---------- friends & sharing ----------
   Firestore (all top-level, see README rules):
   profiles/{uid}          public card: name, handle, photo
   handles/{handle}        {uid} — unique @username
   emails/{email}          {uid} — only if "find me by email" is on and the email is verified
   friends/{uidA_uidB}     request / friendship / block (uids sorted)
   shares/{owner_viewer}   what owner shares with viewer, rebuilt from owner's own data
   collab/{k_id}           shared task, event invite or challenge; members[] can read */
const SO={subs:new Map(),fr:new Map(),prof:new Map(),shares:new Map(),collab:new Map(),frReady:false,coReady:false,pubLoaded:false,shareErr:new Set(),sig:''};
const HANDLE_RE=/^[a-z0-9_.]{3,20}$/;
const SHARE_KEYS=[['mood','Mood','Today’s mood and your recent days'],['star','Favorite days','Days you starred'],['tasks','Tasks','Your task titles — the past week and next 2 weeks'],['prog','Task progress','How many tasks are done today and this week'],['goals','Goals','Goal names and % complete'],['acts','Daily Review activities','Icons you picked in Daily Review — never notes or photos'],['events','Events','Your upcoming events (title and time)']];
const DEF_SHARE={mood:true,star:true,tasks:true,prog:true,goals:true,acts:false,events:false};
const SHARE_PRESETS=[['all','Everything',{mood:true,star:true,tasks:true,prog:true,goals:true,acts:true,events:true}],['def','Default',DEF_SHARE],['light','Mood & progress',{mood:true,star:true,tasks:false,prog:true,goals:false,acts:false,events:false}],['none','Name & photo only',{mood:false,star:false,tasks:false,prog:false,goals:false,acts:false,events:false}]];
const me=()=>S.user&&S.user.uid;
const pairOf=(a,b)=>a<b?a+'_'+b:b+'_'+a;
const otherOf=f=>f.members[0]===me()?f.members[1]:f.members[0];
const dref=(...p)=>FB.fs.doc(FB.db,...p);
const frList=()=>[...SO.fr.values()];
const friendsAccepted=()=>frList().filter(f=>f.status==='accepted');
const friendUids=()=>friendsAccepted().map(otherOf).sort((a,b)=>nameOf(a).localeCompare(nameOf(b)));
const frWith=uid=>SO.fr.get(pairOf(me(),uid));
const isFriend=uid=>{const f=frWith(uid);return !!f&&f.status==='accepted'};
const pf=uid=>SO.prof.get(uid)||null;
const frCfg=()=>S.frcfg||{};
const defShare=()=>Object.assign({},DEF_SHARE,frCfg().def||{});
const shareFor=uid=>{const p=(frCfg().per||{})[uid];return p?Object.assign({},DEF_SHARE,p):defShare()};
function pubWant(){const u=S.user||{},p=S.profile||{};return {uid:u.uid,name:p.name||u.displayName||'',handle:p.handle||'',photo:p.photo||u.photoURL||''}}
function nameOf(uid){if(uid===me())return 'You';const p=pf(uid);return (p&&p.name)||'Friend'}
function avatar(uid,size){
  size=size||36;const p=uid===me()?pubWant():(pf(uid)||{}),nm=(p.name||'?').trim();
  return '<span class="avatar" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.42)+'px">'+(p.photo?'<img src="'+esc(p.photo)+'" alt="" referrerpolicy="no-referrer">':esc((nm[0]||'?').toUpperCase()))+'</span>';
}
function avStack(uids,size){return '<span class="avstack">'+uids.slice(0,4).map(u=>avatar(u,size||20)).join('')+(uids.length>4?'<span class="avmore">+'+(uids.length-4)+'</span>':'')+'</span>'}
function ago(ts){if(!ts)return '';const s=Math.max(0,(Date.now()-ts)/1000);return s<90?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'}

/* listeners */
function soSub(key,ref,next){
  if(SO.subs.has(key))return;
  SO.subs.set(key,FB.fs.onSnapshot(ref,next,e=>{console.warn('listen',key,e&&e.code);SO.subs.delete(key);
    if(key.startsWith('sh:'))SO.shareErr.add(key.slice(3));
    if((key==='fr'||key==='co')&&e&&e.code==='permission-denied')SO.rulesMissing=true;
    soChanged()}));
}
function soUnsub(key){const u=SO.subs.get(key);if(u){try{u()}catch(e){}SO.subs.delete(key)}}
function socialStop(){SO.subs.forEach(u=>{try{u()}catch(e){}});SO.subs.clear();SO.fr=new Map();SO.prof=new Map();SO.shares=new Map();SO.collab=new Map();SO.frReady=SO.coReady=SO.pubLoaded=false;SO.shareErr.clear();SO.sig='';SO.emailDone='';SO.rulesMissing=false}
function socialStart(u){
  socialStop();const fs=FB.fs;
  soSub('fr',fs.query(fs.collection(FB.db,'friends'),fs.where('members','array-contains',u.uid)),snap=>{
    const m=new Map();snap.docs.forEach(d=>m.set(d.id,Object.assign({},d.data(),{id:d.id})));
    const was=friendsAccepted().map(otherOf).sort().join();SO.fr=m;SO.frReady=true;
    if(friendsAccepted().map(otherOf).sort().join()!==was)SO.shareErr.clear();
    soWire();soChanged();publishSoon();
  });
  soSub('co',fs.query(fs.collection(FB.db,'collab'),fs.where('members','array-contains',u.uid)),snap=>{
    const m=new Map();snap.docs.forEach(d=>m.set(d.id,Object.assign({},d.data(),{id:d.id})));SO.collab=m;SO.coReady=true;soWire();soChanged();
  });
  soSub('pf:'+u.uid,dref('profiles',u.uid),d=>{SO.prof.set(u.uid,d.exists()?d.data():null);SO.pubLoaded=true;syncPub()});
}
function soWire(){
  const uid=me();if(!uid)return;
  const need=new Set();frList().forEach(f=>need.add(otherOf(f)));
  SO.collab.forEach(c=>(c.members||[]).forEach(m=>need.add(m)));
  need.delete(uid);
  need.forEach(o=>soSub('pf:'+o,dref('profiles',o),d=>{if(d.exists())SO.prof.set(o,d.data());soChanged()}));
  const acc=new Set(friendsAccepted().map(otherOf));
  acc.forEach(o=>{if(!SO.shareErr.has(o))soSub('sh:'+o,dref('shares',o+'_'+uid),d=>{if(d.exists())SO.shares.set(o,d.data());else SO.shares.delete(o);soChanged()})});
  [...SO.subs.keys()].forEach(k=>{if(k.startsWith('sh:')&&!acc.has(k.slice(3))){soUnsub(k);SO.shares.delete(k.slice(3))}});
}
function soChanged(force){
  if(S.mode!=='app')return;
  const s=stable([[...SO.fr.values()],[...SO.prof.entries()],[...SO.shares.entries()],[...SO.collab.values()],[...SO.shareErr],!!SO.rulesMissing]);
  if(!force&&s===SO.sig)return;SO.sig=s;render();
}

/* my public card + email lookup */
function syncPub(){
  if(!S.profile||!SO.pubLoaded||!S.user)return;
  const w=pubWant(),cur=SO.prof.get(w.uid)||{};
  if(['name','handle','photo'].some(k=>(cur[k]||'')!==(w[k]||''))){const d=Object.assign({},w,{updatedAt:Date.now()});SO.prof.set(w.uid,d);
    enqueue('pub',()=>FB.fs.setDoc(dref('profiles',w.uid),d)).then(ok=>{if(!ok)SO.rulesMissing=true})}
  emailSync();
}
async function emailSync(){
  const u=FB.auth.currentUser||S.user;if(!u||!u.email||!S.profile)return;
  const on=frCfg().emailFind!==false,k=u.email.toLowerCase(),flag=k+'|'+on+'|'+!!u.emailVerified;
  if(SO.emailDone===flag)return;SO.emailDone=flag;
  try{
    if(on){if(u.emailVerified)await FB.fs.setDoc(dref('emails',k),{uid:u.uid})}
    else{const s=await FB.fs.getDoc(dref('emails',k));if(s.exists()&&s.data().uid===u.uid)await FB.fs.deleteDoc(dref('emails',k))}
  }catch(e){console.warn('email lookup',e&&e.code);SO.emailDone=''}
}
async function claimHandle(h){
  h=h.replace(/^@/,'').trim().toLowerCase();
  if(!HANDLE_RE.test(h))return 'Use 3–20 characters: a–z, 0–9, _ or .';
  const old=(S.profile||{}).handle||'';if(h===old)return '';
  try{
    const s=await FB.fs.getDoc(dref('handles',h));
    if(s.exists()&&s.data().uid!==me())return '@'+h+' is taken — try another';
    if(!s.exists())await FB.fs.setDoc(dref('handles',h),{uid:me(),at:Date.now()});
    if(old){try{await FB.fs.deleteDoc(dref('handles',old))}catch(e){}}
    const prof=Object.assign(clone(S.profile),{handle:h,updatedAt:Date.now()});S.profile=prof;await save('profile',prof);syncPub();render();return '';
  }catch(e){console.warn(e);return e&&e.code==='permission-denied'?'Couldn’t save — the new Firestore rules aren’t published yet (see README).':'Couldn’t save — try again'}
}
function suggestHandle(){
  const p=S.profile||{},u=S.user||{};
  let b=((p.name||'').normalize('NFKD').replace(/[^a-zA-Z0-9]/g,'')||(u.email||'').split('@')[0].replace(/[^a-zA-Z0-9_.]/g,'')).toLowerCase().slice(0,14);
  if(b.length<3)b='pv'+b;return b;
}

/* sharing: publish a filtered copy of my data for each friend */
function buildShare(c){
  const td=todayIso(),d={v:1,today:td},from=addDays(td,-62);
  if(c.mood||c.star){const m={},st=[];S.days.forEach(x=>{const dt=x.id.slice(2);if(dt<from||dt>td)return;if(c.mood&&x.mood)m[dt]=x.mood;if(c.star&&x.star)st.push(dt)});if(c.mood)d.mood=m;if(c.star)d.star=st.sort()}
  const own=[...S.tasks.values()];
  if(c.tasks)d.tasks=own.filter(t=>t.date>=addDays(td,-7)&&t.date<=addDays(td,13)&&(!t.done||t.date>=addDays(td,-1)))
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:pr(a).r-pr(b).r).slice(0,80).map(t=>({t:t.title,d:t.date,q:qOf(t),x:!!t.done,s:t.start||''}));
  if(c.prog){const mon=mondayOf(td),end=addDays(mon,6),wk=own.filter(t=>t.date>=mon&&t.date<=end),tt=own.filter(t=>t.date===td);
    d.prog={day:[tt.filter(t=>t.done).length,tt.length],week:[wk.filter(t=>t.done).length,wk.length],mon}}
  if(c.goals)d.goals=activeGoals().slice(0,20).map(g=>({t:g.title,p:Math.round(goalProgress(g)*100),dd:g.targetDate||''}));
  if(c.acts){const a={};for(let k=0;k<7;k++){const dt=addDays(td,-k),sel=dayEntry(dt).sel||{},out=[];
      drBlocks().forEach(b=>{if(b.type!=='choice'||b.hidden)return;(sel[b.id]||[]).forEach(i=>{const it=(b.items||[]).find(x=>x.id===i);if(it)out.push([it.img?'':(it.icon||'⭐'),it.label])})});
      if(out.length)a[dt]=out.slice(0,40)}d.acts=a}
  if(c.events){const ev=[];for(let k=0;k<14;k++){const dt=addDays(td,k);ownEventsOn(dt).forEach(e=>ev.push({t:e.title,d:dt,s:e.time,e:e.end,c:e.color}))}d.events=ev.slice(0,60)}
  return d;
}
function publishSoon(ms){clearTimeout(SO.pubTimer);SO.pubTimer=setTimeout(publishShares,ms||2500)}
async function publishShares(){
  if(S.mode!=='app'||!SO.frReady||SO.publishing){if(SO.publishing)SO.pubAgain=true;return}
  SO.publishing=true;
  try{
    const uid=me(),acc=friendsAccepted().map(otherOf),lsk='pvsh:'+uid;let pub={};try{pub=JSON.parse(localStorage.getItem(lsk)||'{}')}catch(e){}
    const now=Date.now();
    for(const f of acc){const d=buildShare(shareFor(f)),h=hash(stable(d)),old=(pub[f]||'').split('|');
      if(old[0]===h&&now-Number(old[1]||0)<6*3600e3)continue;
      try{await FB.fs.setDoc(dref('shares',uid+'_'+f),{owner:uid,viewer:f,pair:pairOf(uid,f),at:now,d});pub[f]=h+'|'+now}catch(e){console.warn('share',e&&e.code)}}
    for(const f of Object.keys(pub))if(!acc.includes(f)){try{await FB.fs.deleteDoc(dref('shares',uid+'_'+f))}catch(e){}delete pub[f]}
    try{localStorage.setItem(lsk,JSON.stringify(pub))}catch(e){}
  }finally{SO.publishing=false;if(SO.pubAgain){SO.pubAgain=false;publishSoon(1500)}}
}
function saveFrCfg(patch){

}

/* friend requests */
function frWrite(id,fn,okMsg){return enqueue('fr/'+id,fn).then(ok=>{if(ok&&okMsg)toast(okMsg);return ok})}
function sendRequest(uid){
  if(!uid)return;if(uid===me()){toast('That’s you!');return}
  const f=frWith(uid),id=pairOf(me(),uid);
  if(f){if(f.status==='accepted')return toast('You’re already friends');
    if(f.status==='blocked')return toast(f.blockedBy===me()?'You blocked this person — unblock them first':'You can’t add this person');
    if(f.from===me())return toast('Request already sent');return acceptReq(id)}
  const doc={members:[me(),uid].sort(),from:me(),to:uid,status:'pending',createdAt:Date.now()};
  SO.fr.set(id,Object.assign({},doc,{id}));soWire();soChanged(true);
  frWrite(id,()=>FB.fs.setDoc(dref('friends',id),doc),'Friend request sent to '+nameOf(uid));
}
function acceptReq(id){
  const f=SO.fr.get(id);if(!f)return;const doc=Object.assign(strip(f),{status:'accepted',acceptedAt:Date.now()});
  SO.fr.set(id,Object.assign({},doc,{id}));soWire();soChanged(true);
  frWrite(id,()=>FB.fs.setDoc(dref('friends',id),doc),'You’re now friends with '+nameOf(otherOf(f)));publishSoon(800);
}
function dropFr(id,msg){const f=SO.fr.get(id);if(!f)return;SO.fr.delete(id);soWire();soChanged(true);frWrite(id,()=>FB.fs.deleteDoc(dref('friends',id)),msg);publishSoon(800)}
function blockUser(uid){
  const id=pairOf(me(),uid),f=SO.fr.get(id),now=Date.now();
  const doc={members:[me(),uid].sort(),from:f?f.from:me(),to:f?f.to:uid,status:'blocked',blockedBy:me(),createdAt:f&&f.createdAt||now};
  SO.fr.set(id,Object.assign({},doc,{id}));soWire();soChanged(true);
  frWrite(id,()=>FB.fs.setDoc(dref('friends',id),doc),'Blocked '+nameOf(uid));publishSoon(800);
  if(S.route==='friend')go('friends');
}
async function findPeople(q){
  q=(q||'').trim();if(!q)return;S.frSearch={q,loading:true};render();
  try{
    let uid=null;
    if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(q)){
      const s=await FB.fs.getDoc(dref('emails',q.toLowerCase()));uid=s.exists()?s.data().uid:null;
      if(!uid){S.frSearch={q,none:'No one with that email can be found. They may not have signed in yet or turned on “find me by email” — try their @username or send your invite link.'};render();return}
    }else{
      const h=q.replace(/^@/,'').toLowerCase();
      if(!HANDLE_RE.test(h)){S.frSearch={q,none:'Usernames are 3–20 characters: a–z, 0–9, _ or .'};render();return}
      const s=await FB.fs.getDoc(dref('handles',h));uid=s.exists()?s.data().uid:null;
      if(!uid){S.frSearch={q,none:'No one has the username @'+h+'.'};render();return}
    }
    await loadProfile(uid);S.frSearch={q,uid};render();
  }catch(e){console.warn(e);S.frSearch={q,none:e&&e.code==='permission-denied'?'Search isn’t available yet — the new Firestore rules need to be published (see README).':'Couldn’t search — check your connection.'};render()}
}

/* shared items (collab) */
const coList=()=>[...SO.collab.values()];
const coDoneBy=c=>(c.members||[]).filter(u=>c.done&&c.done[u]);
const isAllDone=c=>(c.members||[]).length>0&&coDoneBy(c).length===c.members.length;
function coTaskObj(c){return {id:c.id,shared:true,owner:c.owner,members:c.members||[],title:c.title,date:c.date,q:QUADS[c.q]?c.q:'i',start:c.start||'',end:c.end||'',notes:c.notes||'',star:false,cal:false,goalId:null,msId:null,done:isAllDone(c),mine:!!(c.done&&c.done[me()]),nDone:coDoneBy(c).length,doneAt:null,createdAt:c.createdAt||0}}

function coCreate(kind,data,members){

  const doc=Object.assign({kind,owner:me(),members:[me()].concat(members.filter(u=>u!==me())),createdAt:now,updatedAt:now},data);
  SO.collab.set(id,Object.assign({},doc,{id}));soWire();soChanged(true);
  coWrite(id,()=>FB.fs.setDoc(dref('collab',id),doc));if(doc.cal)gSchedule();return id;

function coSave(id,patch){
  const c=SO.collab.get(id);if(!c)return;
  if(c.owner!==me()){toast('Only '+nameOf(c.owner)+' can change this');return}
  const p=Object.assign({},patch,{updatedAt:Date.now()});
  SO.collab.set(id,Object.assign({},c,p));soWire();soChanged(true);
  coWrite(id,()=>FB.fs.updateDoc(dref('collab',id),p));if(c.cal||p.cal)gSchedule();
}
function coToggle(id){
  const c=SO.collab.get(id);if(!c)return;const u=me(),mine=!!(c.done&&c.done[u]),done=Object.assign({},c.done||{});
  done[u]=mine?false:Date.now();const nc=Object.assign({},c,{done,updatedAt:Date.now()});
  SO.collab.set(id,nc);soChanged(true);
  coWrite(id,()=>FB.fs.updateDoc(dref('collab',id),{['done.'+u]:done[u],updatedAt:nc.updatedAt}));
  if(!mine){if(isAllDone(nc))toast('Done together 🎉');else toast('Your part is done — waiting for '+nc.members.filter(m=>!(done[m])).map(nameOf).join(', '))}
}
function coRsvp(id,v){

function coProg(id,n){

  const prog=Object.assign({},c.prog||{},{[u]:n});SO.collab.set(id,Object.assign({},c,{prog,updatedAt:Date.now()}));soChanged(true);
  clearTimeout(SO['pt'+id]);SO['pt'+id]=setTimeout(()=>coWrite(id,()=>FB.fs.updateDoc(dref('collab',id),{['prog.'+u]:n,updatedAt:Date.now()})),400);

    case 'ch-edit':openChallengeModal(id);return;

    case 'co-open':{closeModal();const c=SO.collab.get(id);if(!c)return;if(c.kind==='goal'){go('goals');return}if(c.owner===me())(c.kind==='event'?openEventModal(id):openTaskModal(id));else openCoView(id);return}
    case 'co-leave':{const c=SO.collab.get(id);if(!c)return;closeModal();const own=c.owner===me();confirmModal(own?'Delete “'+esc(c.title)+'”?':'Leave “'+esc(c.title)+'”?',own?'It’s removed for everyone it’s shared with.':'It disappears from your planner. The others keep it.',own?'Delete':'Leave',()=>coLeave(id));return}

    case 'rv-push':{
      const w=el.dataset.w,k='rv-'+w+'-nextFocus',r=S.reviews.get('r_'+w)||{};
      const txt=Object.prototype.hasOwnProperty.call(S.drafts,k)?S.drafts[k]:(r.nextFocus||'');
      const lines=txt.split('\n').map(s=>s.replace(/^\s*([-•*]|\d+[.)])\s*/,'').trim()).filter(Boolean);
      if(!lines.length){toast('Write something in “What do you want to focus on next week?” first');return}
      if(Object.prototype.hasOwnProperty.call(S.drafts,k))saveReview(w);
      const nw=addDays(w,7),items=focusItems(nw),have=new Set(items.map(i=>i.text));let n=0;
      lines.forEach(t=>{if(!have.has(t)){items.push({id:rid(),text:t,done:false});have.add(t);n++}});
      if(n)saveFocus(nw,items);
      toast(n?'Added '+n+(n===1?' item':' items')+' to the focus for '+weekLabel(nw):'Everything is already in next week’s focus');return}
    case 'copy-json':{
      const p=S.profile||{};const strip2=m=>[...m.values()];
      const data=JSON.stringify({exportedAt:new Date().toISOString(),profile:{name:p.name,email:p.email,createdAt:p.createdAt},tasks:strip2(S.tasks),goals:strip2(S.goals),weeklyFocus:strip2(S.focus),weeklyReviews:strip2(S.reviews),events:strip2(S.events),dailyReviews:strip2(S.days),reviewSetup:S.drcfg,photoCount:S.photos.size},null,2);
      const fallback=()=>openModal(mHead('All data (JSON)')+'<p class="sub" style="margin-bottom:10px">Copy the text below to keep it</p><textarea readonly rows="12" style="font-family:monospace;font-size:12.5px">'+esc(data)+'</textarea><div class="mf"><button class="btn" data-act="close-modal">Close</button></div>');
      try{navigator.clipboard.writeText(data).then(()=>toast('Copied to clipboard'),fallback)}catch(err){fallback()}
      return}
    case 'delete-all':
      openModal(mHead('Delete all data?')+'<form data-form="delete-all" novalidate><p class="sub" style="margin-bottom:12px">Everything will be deleted permanently. Type <b>DELETE</b> to confirm.</p>'
        +'<div class="field"><input type="text" name="cf" autofocus autocomplete="off" aria-label="Type DELETE to confirm"></div><p class="err" id="del-err"></p>'
        +'<div class="mf"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn danger solid">Delete everything</button></div></form>');
      return;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.act==='share-set'){const sc=el.dataset.scope,k=el.dataset.key;
    if(sc==='*')saveFrCfg({def:Object.assign(defShare(),{[k]:el.checked})});else{const per=clone(frCfg().per||{});per[sc]=Object.assign(shareFor(sc),{[k]:el.checked});saveFrCfg({per});openShareModal(sc)}return}
  if(el.dataset&&el.dataset.act==='email-find'){saveFrCfg({emailFind:el.checked});SO.emailDone='';emailSync();return}
  if(el.dataset&&el.dataset.act==='co-rsvp'){coRsvp(el.dataset.id,el.value);openCoView(el.dataset.id);return}
  if(el.dataset&&el.dataset.act==='ch-set'){coProg(el.dataset.id,Number(el.value)||0);return}
  if(el.id==='av-file'&&el.files&&el.files[0]){fileToIcon(el.files[0]).then(u=>{const prof=Object.assign(clone(S.profile),{photo:u,updatedAt:Date.now()});S.profile=prof;render();save('profile',prof);syncPub();toast('Photo updated')}).catch(()=>toast('Couldn’t read that image'));return}
  if(el.dataset&&el.dataset.act==='pick-day'&&el.value){S.dailyDate=el.value;render()}
  if(el.dataset&&el.dataset.act==='pick-drday'&&el.value){S.reviewDay=el.value;render()}
  if(el.dataset&&el.dataset.act==='ev-allday'&&el.form){const on=el.checked;el.form.querySelectorAll('.evtime').forEach(x=>x.hidden=on);el.form.querySelectorAll('.evday').forEach(x=>x.hidden=!on);const l=el.form.querySelector('label[for=e-date]');if(l)l.textContent=on?'Start date':'Date'}
  if(el.name==='st'&&el.form&&el.form.dataset.form==='event'&&el.value&&gcalOn())el.form.elements.cal.checked=true;
  if(el.dataset&&el.dataset.sleep){const d=el.dataset.d,e=dayEntry(d),sl=Object.assign({},e.sleep||{});sl[el.dataset.sleep]=el.value;saveDay(d,{sleep:sl})}
  if(el.dataset&&el.dataset.photo&&el.files&&el.files[0]){const d=el.dataset.photo,f=el.files[0];
    if(photosOn(d).length>=3){toast('Up to 3 photos a day');return}
    toast('Adding photo…');fileToPhoto(f).then(data=>{const id='p_'+d+'_'+rid(),doc={date:d,data,createdAt:Date.now()};S.photos.set(id,Object.assign({},doc,{id}));render();return save(id,doc)}).catch(()=>toast('Couldn’t read that image'))}
  if(el.id==='it-img'&&el.files&&el.files[0]){fileToIcon(el.files[0]).then(u=>{S.itemImg=u;itPreview()}).catch(()=>toast('Couldn’t read that image'))}
  if(el.name==='st'&&el.form&&el.form.dataset.form==='task'&&el.value&&gcalOn())el.form.elements.cal.checked=true;
  if(el.dataset&&el.dataset.act==='gcal-show'){const set=new Set(gcalCfg().show||[]);if(el.checked)set.add(el.value);else set.delete(el.value);saveGcal({show:[...set]});G.events.clear();render()}
});
document.addEventListener('input',e=>{
  const el=e.target;if(el.id==='it-em'){S.itemImg='';itPreview()}if(!el.dataset||!el.dataset.k)return;
  S.drafts[el.dataset.k]=el.value;
  if(el.dataset.dr){const d=el.dataset.d;const st=$('#dr-status');if(st)st.textContent='Typing…';clearTimeout(S.rvTimer);S.rvTimer=setTimeout(()=>saveDay(d,{},true),800)}
  if(el.dataset.rv){const w=el.dataset.w;const st=$('#rv-status');if(st)st.textContent='Typing…';
    clearTimeout(S.rvTimer);S.rvTimer=setTimeout(()=>saveReview(w),800)}
});
document.addEventListener('focusout',e=>{
  const el=e.target;if(S.rendering||!el.isConnected)return;if(el.dataset&&el.dataset.dr&&Object.prototype.hasOwnProperty.call(S.drafts,el.dataset.k)){clearTimeout(S.rvTimer);saveDay(el.dataset.d,{},true)}if(el.dataset&&el.dataset.rv&&Object.prototype.hasOwnProperty.call(S.drafts,el.dataset.k)){clearTimeout(S.rvTimer);saveReview(el.dataset.w)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal()});
document.addEventListener('submit',async e=>{
  const f=e.target;const kind=f.dataset&&f.dataset.form;if(!kind)return;e.preventDefault();
  const el=f.elements;
  switch(kind){
    case 'signin':return doSignin(f);
    case 'signup':return doSignup(f);
    case 'reset':return doReset(f);
    case 'event':{const id=f.dataset.id,title=el.title.value.trim();if(!title){el.title.focus();return}
      const allDay=el.allday.checked,date=el.date.value||todayIso(),st=allDay?'':(el.st.value||''),et=st&&el.et.value>st?el.et.value:'';
      const ed=allDay&&el.ed.value>date?el.ed.value:'',rep=el.rep.value||'none',until=rep!=='none'&&el.until.value>=date?el.until.value:'';
      const evd={title,date,allDay:allDay||!st,start:st,end:et,endDate:ed,repeat:rep,until,location:el.loc.value.trim(),notes:el.notes.value.trim(),color:el.color.value||EV_COLORS[0][0],cal:el.cal.checked},inv=pickedFriends(f);
      if(id&&id.startsWith('k_')){coSave(id,Object.assign(evd,{members:[me()].concat(inv)}));closeModal();return}
      if(inv.length){if(id){const old=S.events.get(id);if(old){S.events.delete(id);removeDoc(id);if(old.cal)gSchedule()}}coCreate('event',Object.assign(evd,{rsvp:{}}),inv);closeModal();toast('Invite sent to '+inv.map(nameOf).join(', '));return}
      saveEvent(id||null,evd);
      closeModal();return}
    case 'ex-add':{const d=f.dataset.d,t=el.t.value.trim(),mn=Math.max(0,Math.min(1440,parseInt(el.m.value,10)||0));if(!t){el.t.focus();return}
      const e=dayEntry(d);saveDay(d,{exlog:(e.exlog||[]).concat({id:rid(),type:t,min:mn})});return}
    case 'dr-item':{const b=f.dataset.b,i=f.dataset.i,lb=el.lb.value.trim();if(!lb){el.lb.focus();return}
      const icon=(el.em.value||'').trim()||'⭐',img=S.itemImg||'',hidden=el.hd.checked;
      mutBlocks(bl=>{const x=bl.find(y=>y.id===b);if(!x)return;if(i){const it=x.items.find(y=>y.id===i);if(it)Object.assign(it,{label:lb,icon,img,hidden})}else x.items.push({id:'x_'+rid(),label:lb,icon,img,hidden})});
      closeModal();return}
    case 'dr-block':{const nm=el.nm.value.trim();if(!nm){el.nm.focus();return}mutBlocks(bl=>{const x=bl.find(y=>y.id===f.dataset.b);if(x)x.name=nm});closeModal();return}
    case 'dr-newblock':{const nm=el.nm.value.trim();if(!nm){el.nm.focus();return}mutBlocks(bl=>{bl.push({id:'c_'+rid(),name:nm,type:'choice',hidden:false,items:[]})});closeModal();S.drTab='use';toast('Block created — add choices with “New icon”');return}
    case 'qa':{
      const key=f.dataset.key,title=el.title.value.trim();if(!title){el.title.focus();return}
      const q=f.dataset.q||'i';
      delete S.drafts[key];el.title.value='';
      addTask({title,date:f.dataset.date,q});return}
    case 'focus-add':{
      const key=f.dataset.key,text=el.text.value.trim();if(!text)return;
      delete S.drafts[key];el.text.value='';
      const w=f.dataset.w,items=focusItems(w);items.push({id:rid(),text,done:false});saveFocus(w,items);return}
    case 'ms-add':{
      const key=f.dataset.key,title=el.title.value.trim();if(!title)return;
      delete S.drafts[key];el.title.value='';
      const g=clone(S.goals.get(f.dataset.g));if(!g)return;g.milestones=g.milestones||[];g.milestones.push({id:rid(),title,done:false,due:''});saveGoal(g);return}
    case 'task':{
      const id=f.dataset.id,title=el.title.value.trim();if(!title){el.title.focus();return}
      const parts=(el.ms.value||'').split('|');
      const st=el.st.value||'',et=st&&el.et.value>st?el.et.value:'';
      const data={title,date:el.date.value||todayIso(),start:st,end:et,cal:el.cal.checked,q:el.prio.value||'i',notes:el.notes.value.trim(),star:el.star.checked,goalId:parts[0]||null,msId:parts[1]||null};
      const inv=pickedFriends(f),cd={title:data.title,date:data.date,start:st,end:et,q:data.q,notes:data.notes};
      if(id&&id.startsWith('k_')){const c=SO.collab.get(id);if(c&&c.owner===me())coSave(id,Object.assign(cd,{members:[me()].concat(inv)}));if(el.done&&c&&el.done.checked!==!!(c.done&&c.done[me()]))coToggle(id);closeModal();return}
      if(inv.length){if(id){const old=S.tasks.get(id);if(old){S.tasks.delete(id);removeDoc(id);if(old.cal)gSchedule()}}coCreate('task',Object.assign(cd,{done:{}}),inv);closeModal();toast('Shared with '+inv.map(nameOf).join(', '));return}
      if(id){const t=S.tasks.get(id);if(el.done&&t&&el.done.checked!==!!t.done){data.done=el.done.checked;data.doneAt=el.done.checked?Date.now():null}patchTask(id,data)}
      else addTask(data);
      closeModal();return}
    case 'goal':{
      const id=f.dataset.id,title=el.gt.value.trim();if(!title){$('#goal-err').textContent='Please give your goal a name';el.gt.focus();return}
      const base={title,description:el.gd.value.trim(),horizon:el.gh.value||'short',targetDate:el.gdate.value||''};
      if(id){const g=clone(S.goals.get(id));if(!g)return;Object.assign(g,base);saveGoal(g)}
      else{const now=Date.now();const ms=(el.gms?el.gms.value:'').split('\n').map(s=>s.replace(/^\s*([-•*]|\d+[.)])\s*/,'').trim()).filter(Boolean).map(t=>({id:rid(),title:t,done:false,due:''}));
        saveGoal(Object.assign({id:'g_'+rid(),status:'active',milestones:ms,createdAt:now},base));S.goalFilter='active'}
      closeModal();if(S.route!=='goals')go('goals');return}
    case 'ms-edit':{
      const g=clone(S.goals.get(f.dataset.g));if(!g)return;const m=(g.milestones||[]).find(x=>x.id===f.dataset.m);if(!m)return;
      const t=el.mt.value.trim();if(!t){el.mt.focus();return}m.title=t;m.due=el.md.value||'';saveGoal(g);closeModal();return}
    case 'handle':{const v=(el.h.value||el.h.placeholder||'').trim();const m=await claimHandle(v);const er=$('#handle-err');if(m){if(er)er.textContent=m}else{delete S.drafts['handle-new'];delete S.drafts['handle-set'];render();toast('Username saved: @'+S.profile.handle)}return}
    case 'fr-find':findPeople(el.q.value);return;
    case 'challenge':{const id=f.dataset.id,title=el.t.value.trim(),inv=pickedFriends(f),er=$('#ch-err');if(!title){el.t.focus();return}
      if(!inv.length){er.textContent='Pick at least one friend';return}
      const cd={title,target:Math.max(0,parseInt(el.n.value,10)||0),unit:el.u.value.trim(),due:el.d.value||'',desc:el.x.value.trim()};
      if(id)coSave(id,Object.assign(cd,{members:[me()].concat(inv)}));else coCreate('goal',Object.assign(cd,{prog:{}}),inv);
      closeModal();if(S.route!=='goals'&&S.route!=='friend')go('goals');return}
    case 'profile':{
      const name=el.nm.value.trim(),err=$('#prof-err');
      if(!name){err.textContent='Please enter a name';return}
      err.textContent='';delete S.drafts['set-nm'];
      const prof=Object.assign(clone(S.profile),{name,updatedAt:Date.now()});S.profile=prof;render();
      if(await save('profile',prof))toast('Profile saved');return}
    case 'delete-all':{
      if(el.cf.value.trim().toUpperCase()!=='DELETE'){$('#del-err').textContent='Type DELETE to confirm';return}
      busy(f,true);S.deleting=true;
      const ids=[...S.tasks.keys(),...S.goals.keys(),...S.focus.keys(),...S.reviews.keys(),...S.days.keys(),...S.photos.keys(),...S.events.keys()].concat(S.drcfg?['drcfg']:[]).concat(S.frcfg?['friendcfg']:[]);
      let ok=true;for(const id of ids){if(!(await removeDoc(id)))ok=false}
      if(ok)ok=await removeDoc('profile');
      S.deleting=false;closeModal();
      if(ok){toast('All data deleted');FB.au.signOut(FB.auth)}
      else toast('Some data couldn’t be deleted — please try again');
      return}
  }
});

boot();
})();
</script>
</body>
