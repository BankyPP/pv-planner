<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Planner</title>
<meta name="theme-color" content="#F6F7F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F6FDB'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Noto+Color+Emoji&family=Sarabun:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --border:#E4E7EB; --border2:#EEF0F3;
  --ink:#111827; --text:#1F2937; --muted:#6B7280; --faint:#9CA3AF;
  --accent:#2F6FDB; --accent-ink:#1E4FA8; --accent-soft:#EAF1FD;
  --ok:#16803C; --ok-soft:#E7F5EC;
  --hi:#B42318; --hi-soft:#FDECEA; --md:#B45309; --md-soft:#FEF3E2; --lo:#4B5563; --lo-soft:#F1F3F5;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scrollbar-gutter:stable}
body{font-family:'Sarabun',system-ui,sans-serif;font-size:15.5px;line-height:1.6;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Kanit',sans-serif;margin:0;line-height:1.35;color:var(--ink)}
h1{font-size:26px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:500}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{flex:none;display:block}
.sub{color:var(--muted);font-size:14.5px}
.fine{color:var(--faint);font-size:13.5px}

/* buttons */
.btn{font-family:'Kanit',sans-serif;font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;line-height:1.3;white-space:nowrap;color:var(--text)}
.btn:hover{background:#F3F4F6}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.danger{color:var(--hi);border-color:#F1C4BE}
.btn.danger:hover{background:var(--hi-soft)}
.btn.danger.solid{background:var(--hi);border-color:var(--hi);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#EEF0F3}
.btn.full{width:100%}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--faint);padding:0;flex:none}
.ibtn:hover{background:#F1F2F4;color:var(--text)}
.link{font-family:'Kanit',sans-serif;font-size:13.5px;font-weight:500;color:var(--accent);background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:var(--accent-ink);text-decoration:underline}

/* inputs */
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{border:1px solid var(--border);border-radius:10px;background:#fff;padding:9px 12px;font-size:15px;width:100%;outline:none;font-family:'Sarabun',sans-serif}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,219,.14)}
textarea{resize:vertical;min-height:84px;line-height:1.6}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{display:block;font-family:'Kanit',sans-serif;font-size:14px;font-weight:500;margin-bottom:6px;color:var(--ink)}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-line{display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer}
.check-line input{width:17px;height:17px;accent-color:var(--accent)}

/* segmented choice */
.seg{display:flex;gap:6px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:1px solid var(--border);border-radius:9px;padding:7px 4px;font-family:'Kanit',sans-serif;font-size:14px;cursor:pointer;background:#fff}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.seg input:checked+span{background:var(--accent-soft);color:var(--accent-ink);border-color:#B9CDF3}
.seg .hi input:checked+span{background:var(--hi-soft);color:var(--hi);border-color:#F1C4BE}
.seg .md input:checked+span{background:var(--md-soft);color:var(--md);border-color:#F4D3A6}
.seg .lo input:checked+span{background:var(--lo-soft);color:var(--lo);border-color:#D5D9DF}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph .sub{margin-top:2px}

/* tags */
.tag{font-family:'Kanit',sans-serif;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;line-height:1.65;white-space:nowrap;display:inline-block}
.tag.hi{background:var(--hi-soft);color:var(--hi)}
.tag.md{background:var(--md-soft);color:var(--md)}
.tag.lo{background:var(--lo-soft);color:var(--lo)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ac{background:var(--accent-soft);color:var(--accent-ink)}
.pdot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:9px}
.pdot.hi{background:#E0675B}.pdot.md{background:#E3A04B}.pdot.lo{background:#B8BEC7}

/* google calendar */
.gbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#FFF7E0;border:1px solid #F3DE9E;color:#7A5B00;border-radius:10px;padding:8px 12px;margin-bottom:16px;font-size:14px}
.gbar span{display:flex;align-items:center;gap:8px}
.evlist{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.ev{display:flex;align-items:baseline;gap:8px;padding:5px 8px 5px 10px;border-radius:8px;background:#F6F7F9;border-left:3px solid var(--evc);color:var(--text);text-decoration:none;font-size:14px;min-width:0}
.ev:hover{background:#EEF0F3}
.evt{font-family:'Kanit',sans-serif;font-size:12.5px;color:var(--muted);white-space:nowrap;flex:none}
.evn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evc{font-size:12px;color:var(--faint);white-space:nowrap;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.evlist.compact .ev{padding:3px 6px 3px 8px;font-size:13px}
.callist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.callist .sw{width:12px;height:12px;border-radius:3px;flex:none}
.tm{font-family:'Kanit',sans-serif;font-size:12.5px;color:var(--muted);margin-right:6px}
.gc{display:inline-block;margin-left:5px;color:var(--faint);vertical-align:-1px}
.trow{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
@media (max-width:860px){.trow{grid-template-columns:1fr 1fr}.trow .field:first-child{grid-column:1/-1}}

/* events */
.ev.own{border:0;border-left:3px solid var(--evc);text-align:left;width:100%;font:inherit;cursor:pointer;background:color-mix(in srgb,var(--evc) 12%,#fff)}
.ev.own:hover{background:color-mix(in srgb,var(--evc) 20%,#fff)}
.rep{color:var(--muted);margin-right:4px;font-size:12px}
.mev.own{cursor:pointer;background:color-mix(in srgb,var(--evc) 14%,#fff)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:26px;height:26px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.swatches input:checked+span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}

/* month & year */
.mgrid-card{padding:10px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mwd{font-family:'Kanit',sans-serif;font-size:12.5px;color:var(--faint);text-align:center;padding:2px 0 4px}
.mc{min-height:112px;border:1px solid var(--border2);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:2px;min-width:0;background:#fff}
.mc.out{background:#FAFAFB}.mc.out .mnum{color:#C4C8CE}
.mc.today{border-color:#B9CDF3;box-shadow:inset 0 0 0 1px #B9CDF3}
.mch{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:2px}
.mnum{border:0;background:none;padding:0 3px;font-family:'Kanit',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink);border-radius:6px;min-height:22px}
.mnum:hover{background:#EEF0F3}
.mc.today .mnum{color:var(--accent)}
.mtk,.mev{font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;padding:1px 4px;cursor:pointer}
.mtk{display:flex;align-items:center;gap:4px}
.mtk i{width:6px;height:6px;border-radius:50%;flex:none}
.mtk:hover{background:#F3F4F6}
.mtk.done{color:var(--faint);text-decoration:line-through}
.mtk b,.mev b{font-family:'Kanit',sans-serif;font-weight:500;color:var(--muted)}
.mev{background:#F3F4F6;border-left:3px solid var(--evc);cursor:default}
.mmore{border:0;background:none;padding:0 4px;text-align:left;font-size:11.5px;color:var(--accent);font-family:'Kanit',sans-serif}
.msum{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.mbars{display:flex;flex-direction:column;gap:8px}
.mbar{display:grid;grid-template-columns:24px 1fr 28px;align-items:center;gap:10px}
.mbar .fine{text-align:right}
.yearg{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px 20px}
.ymt{border:0;background:none;padding:0;font-family:'Kanit',sans-serif;font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:6px}
.ymt:hover{color:var(--accent)}
.ygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ywd{font-size:10px;color:var(--faint);text-align:center;font-family:'Kanit',sans-serif}
.yc{aspect-ratio:1;border:0;border-radius:4px;padding:0;font-size:9px;color:#9A6B00;line-height:1;display:grid;place-items:center;cursor:pointer}
.yc.out{background:transparent;cursor:default}
.yc.today{box-shadow:0 0 0 2px var(--accent)}
.yc.star{box-shadow:inset 0 0 0 1.5px #E2A912}
.yc:not(.out):hover{transform:scale(1.15)}
.ylegend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.ylegend span{display:inline-flex;align-items:center;gap:4px}
.ylegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
@media (max-width:860px){
  .mgrid-card{padding:6px}
  .mgrid{gap:2px}
  .mc{min-height:74px;padding:3px;border-radius:7px}
  .mtk,.mev{font-size:0;padding:0;height:5px;border-radius:3px;margin:1px 0}
  .mtk i{display:none}
  .mtk{background:#C9D8F5}.mtk.done{background:#D5DAE0}
  .mev{border-left:0;background:var(--evc);opacity:.55}
  .mmore{font-size:10px;padding:0}
  .mnum{font-size:12px}
  .mch{flex-wrap:wrap;gap:1px}
  .mc .face{width:14px;height:14px}
  .mc .dstar{transform:scale(.85)}
  .yearg{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
}

/* daily review */
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;line-height:1}
.drwrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.drhead{align-items:center}
.drhead h1{font-size:22px}
.nb{border:1px solid var(--border);background:#fff}
.navrow input[type=date]{width:auto}
.drmood{text-align:center}
.drmood h2{margin-bottom:14px;font-weight:500}
.faces{display:flex;justify-content:space-around;gap:6px;flex-wrap:wrap}
.fbtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:12px;font-family:'Kanit',sans-serif;font-size:12.5px;color:var(--muted)}
.fbtn:hover .face{transform:scale(1.06)}
.fbtn.on{color:var(--ink)}
.face{display:block;transition:transform .12s}
.drb{padding:14px 16px}
.drh{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:2px 0;text-align:left;color:inherit}
.drh h2{font-size:17px}
.drh .chev{margin-left:auto;color:var(--faint)}
.drh.static .spacer{flex:1}
.drcnt{font-family:'Kanit',sans-serif;font-size:12px;font-weight:600;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:0 8px;line-height:20px}
.drbody{margin-top:12px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 6px}
.chip{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px;border-radius:12px;min-width:0}
.chip .ico{width:58px;height:58px;border-radius:50%;background:#F1F2F4;display:grid;place-items:center;transition:background .12s,transform .12s}
.chip .ico .emo{font-size:28px;filter:grayscale(1);opacity:.45;transition:filter .12s,opacity .12s}
.chip .ico .ico-img{width:40px;height:40px;border-radius:50%;object-fit:cover;filter:grayscale(1);opacity:.5}
.chip .lab{font-size:12.5px;color:var(--faint);text-align:center;line-height:1.3;word-break:break-word}
.chip:hover .ico{transform:scale(1.05)}
.chip.on .ico{background:#EAF5E4;box-shadow:inset 0 0 0 2px #CFE8C2}
.chip.on .ico .emo,.chip.on .ico .ico-img{filter:none;opacity:1}
.chip.on .lab{color:var(--ink)}
.chip.hid{opacity:.45}
.addchip .ico{background:#F3F8EF;color:var(--ok);box-shadow:inset 0 0 0 1.5px #D8EBCD}
.addchip .lab{color:var(--ok)}
.sleeprow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.sleeprow label{display:flex;flex-direction:column;gap:4px;font-family:'Kanit',sans-serif;font-size:13px;color:var(--muted)}
.sleeprow input{width:140px}
.sleepdur{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.sleepdur b{display:block;font-family:'Kanit',sans-serif;font-size:20px;color:var(--ink)}
.wxrow{display:flex;align-items:center;gap:12px}
.wxi{font-size:38px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,150px));gap:10px}
.ph-th,.ph-add{aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#F6F7F9;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--ok)}
.ph-th img{width:100%;height:100%;object-fit:cover;display:block}
.ph-add{border-style:dashed;background:#F3F8EF}
.exlist{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.exrow{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--border2)}
.exrow span:first-child{flex:1}
.exform{display:flex;gap:8px}
.exform input[name=t]{flex:1;min-width:0}
.exform input[name=m]{width:84px}
input[type=number]{border:1px solid var(--border);border-radius:10px;background:#fff;padding:9px 12px;font-size:15px;outline:none;font-family:'Sarabun',sans-serif}
.drbar{position:sticky;bottom:12px;display:flex;align-items:center;gap:10px;background:rgba(246,247,249,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px;border-radius:16px;z-index:5}
.drstar{width:52px;height:48px;border-radius:14px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:var(--faint);flex:none}
.drstar.on{color:#D99A00}.drstar.on svg{fill:#F7C531;stroke:#E2A912}
.btn.primary.drdone{flex:1;height:48px;font-size:17px;border-radius:14px;background:#4CAF6A;border-color:#4CAF6A}
.btn.primary.drdone:hover{background:#3F9A5B;border-color:#3F9A5B}
#dr-status{position:absolute;right:16px;top:-16px;font-size:12px;color:var(--faint)}
.newblock{border:0;background:#E7F4E0;color:#3F8A55;font-family:'Kanit',sans-serif;font-size:16px;font-weight:500;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.newblock:hover{background:#DDEFD4}
.tpls{display:flex;flex-direction:column;gap:8px}
.tpl{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.tpl .fine{font-family:'Noto Color Emoji','Apple Color Emoji',sans-serif}
.itprev{display:flex;justify-content:center;margin-bottom:12px}
.ico.big{width:76px;height:76px;border-radius:50%;background:#EAF5E4;display:grid;place-items:center}
.ico.big .emo{font-size:38px}
.ico.big .ico-img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.palette{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.palette button{border:0;background:#F3F4F6;border-radius:8px;width:36px;height:36px;font-size:20px;padding:0}
.palette button:hover{background:#E7E9EC}
.moodbtn{border:0;background:none;padding:0;display:inline-grid;place-items:center;flex:none;border-radius:50%;cursor:pointer;opacity:.55}
.moodbtn.has{opacity:1}
.moodbtn:hover{opacity:1;transform:scale(1.08)}
.dstar{position:relative;display:inline-grid;place-items:center;vertical-align:middle;flex:none}
.dstar svg{position:absolute;inset:0}
.dstar b{position:relative;font-family:'Kanit',sans-serif;font-size:10.5px;font-weight:700;color:#5A4100;margin-top:2px}
.dh .moodbtn{margin-right:2px}
.dh .dn,.dh .dd{white-space:nowrap}
.dh .dd{display:inline-flex;align-items:center;gap:3px}
.dh{gap:5px}
.dsub{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wl{display:flex;align-items:center;gap:6px}
.wkmoods{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;text-align:center}
.wkmoods div{display:flex;flex-direction:column;align-items:center;gap:2px}
@media (max-width:860px){
  .chips{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 4px}
  .chip .ico{width:54px;height:54px}
  .drbar{bottom:calc(68px + env(safe-area-inset-bottom))}
  .drhead .navrow{width:100%}
  .drhead h1{font-size:19px}
  .faces .face{width:48px;height:48px}
}

/* quadrants */
:root{--q-iu:#E0584F;--q-iu-soft:#FDEEEC;--q-i:#3F7AE0;--q-i-soft:#EAF1FD;--q-u:#C99A06;--q-u-soft:#FDF5DC;--q-s:#7C8794;--q-s-soft:#F0F2F5}
.quad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.qbox{border:1px solid var(--border);border-radius:12px;padding:12px 12px 8px;min-width:0;display:flex;flex-direction:column;background:#fff}
.qbox .tlist{flex:1}
.qh{display:flex;align-items:center;gap:7px;margin-bottom:4px;min-width:0}
.qic{display:grid;place-items:center}
.qn{font-family:'Kanit',sans-serif;font-weight:600;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbadge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;color:#fff;font-family:'Kanit',sans-serif;font-size:12.5px;font-weight:600;display:grid;place-items:center}
.qempty{color:var(--faint);font-size:14px;padding:4px 2px 6px;flex:1}
.qbox .qa.mini{margin-top:4px}
.qbox .qa.mini input{padding:5px 8px;font-size:13.5px}
.q-iu .qic,.q-iu .qn{color:var(--q-iu)} .q-iu .qbadge{background:var(--q-iu)} .qbox.q-iu{background:linear-gradient(var(--q-iu-soft),#fff 64px)}
.q-i .qic,.q-i .qn{color:var(--q-i)} .q-i .qbadge{background:var(--q-i)} .qbox.q-i{background:linear-gradient(var(--q-i-soft),#fff 64px)}
.q-u .qic,.q-u .qn{color:var(--q-u)} .q-u .qbadge{background:var(--q-u)} .qbox.q-u{background:linear-gradient(var(--q-u-soft),#fff 64px)}
.q-s .qic,.q-s .qn{color:var(--q-s)} .q-s .qbadge{background:var(--q-s)} .qbox.q-s{background:linear-gradient(var(--q-s-soft),#fff 64px)}
.qbox.q-iu .chk{border-color:var(--q-iu)} .qbox.q-i .chk{border-color:var(--q-i)} .qbox.q-u .chk{border-color:var(--q-u)} .qbox.q-s .chk{border-color:var(--q-s)}
.qbox.q-iu .done>.chk{background:var(--q-iu)} .qbox.q-i .done>.chk{background:var(--q-i)} .qbox.q-u .done>.chk{background:var(--q-u)} .qbox.q-s .done>.chk{background:var(--q-s)}
.qbox .chk{border-radius:50%}
.qbox .task.compact .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.tag.q-iu{background:var(--q-iu-soft);color:var(--q-iu)} .tag.q-i{background:var(--q-i-soft);color:var(--q-i)} .tag.q-u{background:var(--q-u-soft);color:#9A7404} .tag.q-s{background:var(--q-s-soft);color:#5B6573}
.tag .ic{display:inline-block;vertical-align:-2px;margin-right:3px}
.pdot.q-iu{background:var(--q-iu)} .pdot.q-i{background:var(--q-i)} .pdot.q-u{background:var(--q-u)} .pdot.q-s{background:#AEB6C0}
.qseg{display:grid;grid-template-columns:1fr 1fr}
.qseg span{display:flex;align-items:center;justify-content:center;gap:6px}
.seg .q-iu input:checked+span{background:var(--q-iu-soft);color:var(--q-iu);border-color:var(--q-iu)}
.seg .q-i input:checked+span{background:var(--q-i-soft);color:var(--q-i);border-color:var(--q-i)}
.seg .q-u input:checked+span{background:var(--q-u-soft);color:#9A7404;border-color:var(--q-u)}
.seg .q-s input:checked+span{background:var(--q-s-soft);color:#5B6573;border-color:var(--q-s)}
.notice.late-note{background:var(--hi-soft);color:var(--hi);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.notice.late-note .link{color:var(--hi)}
@media (max-width:360px){.quad{grid-template-columns:minmax(0,1fr)}}

/* tasks */
.tlist{display:flex;flex-direction:column}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-radius:10px}
.task+.task{border-top:1px solid var(--border2)}
.task:hover{background:#FAFBFC}
.chk{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;border:1.6px solid #C5CAD1;background:#fff;display:grid;place-items:center;color:transparent;padding:0}
.chk:hover{border-color:var(--accent);color:#C5CAD1}
.done>.chk,.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttl{word-break:break-word}
.done .ttl{color:var(--faint);text-decoration:line-through}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:13px;color:var(--muted);align-items:center}
.meta{display:inline-flex;align-items:center;gap:4px}
.meta.late{color:var(--hi)}
.task .ibtn{width:28px;height:28px}
.star.on{color:#D99A00}

.task.compact{padding:5px 2px;gap:8px;font-size:14.5px}

.num{font-family:'Kanit',sans-serif;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none;margin-top:0}
.sec{font-family:'Kanit',sans-serif;font-size:13.5px;font-weight:500;color:var(--muted);margin:16px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec.late{color:var(--hi)}
.empty{color:var(--faint);font-size:14.5px;padding:10px 4px}

/* quick add */
.qa{display:flex;gap:8px;margin-bottom:6px}
.qa input{flex:1;min-width:0}
.qa select{width:auto;flex:none;padding-right:28px}
.qa.mini{margin:6px 0 0}
.qa.mini input{border-style:dashed;background:transparent;padding:6px 10px;font-size:14px}
.qa.mini input:focus{border-style:solid;background:#fff}

/* progress */
.bar{height:8px;background:#EEF0F3;border-radius:999px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.bar.ok>i{background:var(--ok)}
.prog{display:flex;align-items:center;gap:10px}
.prog .pct{font-family:'Kanit',sans-serif;font-size:13.5px;font-weight:500;color:var(--muted);min-width:42px;text-align:right}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .lbl2{font-family:'Kanit',sans-serif;font-size:13.5px;color:var(--muted)}
.stat .val{font-family:'Kanit',sans-serif;font-size:26px;font-weight:600;line-height:1.25;color:var(--ink)}
.stat .hint{font-size:13px;color:var(--faint)}
.stat.warn .val{color:var(--hi)}
button.stat{text-align:left;width:100%;font:inherit}
button.stat:hover{border-color:#CBD2DB}

/* week rows */
.wrow{display:grid;grid-template-columns:118px 1fr 40px;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.wrow .wl{color:var(--muted)}
.wrow.today .wl{color:var(--accent);font-weight:700}
.wrow .wc{text-align:right;font-family:'Kanit',sans-serif;font-size:13px;color:var(--muted)}

/* goals */
.goal-mini{padding:10px 0}
.goal-mini+.goal-mini{border-top:1px solid var(--border2)}
.goal-mini .gt{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.goal-mini .gt b{font-weight:700}
.tabs{display:flex;gap:4px;background:#EBEEF2;padding:4px;border-radius:11px;max-width:100%;overflow-x:auto;margin-bottom:16px;width:max-content}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:8px;font-family:'Kanit',sans-serif;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs .active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-items:start}
.gh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.gtitle{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.gdesc{color:var(--muted);font-size:14.5px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.gact{display:flex;gap:2px;flex:none}
.goal .prog{margin:14px 0 6px}
.ms{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--border2)}
.ms .msb{flex:1;min-width:0}
.ms.done>.msb>.ttl{color:var(--faint);text-decoration:line-through}
.ms.done>.chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ms .subtasks{margin-top:4px;padding-left:2px}
.ms .ibtn{width:28px;height:28px}
.ms-head{font-family:'Kanit',sans-serif;font-size:13.5px;font-weight:500;color:var(--muted);margin-top:10px;margin-bottom:2px}

/* weekly */
.wk-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto 1fr;grid-template-areas:"days cal" "days aside";gap:16px;align-items:start}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.day{padding:14px;scroll-margin-top:70px}
.day.is-today{border-color:#B9CDF3}
.day.is-past{background:#EEF0F3;border-color:#E2E5EA}

/* calendar */

/* review */
.mood{display:flex;gap:6px;flex-wrap:wrap}

.donelist{margin:8px 0 0;padding:0;list-style:none}

/* layout */
.side{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:16px;z-index:10}

  .navrow .lab{min-width:0;flex:1}

}

.chk.half{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 3px,#fff 3px 6px);border-color:var(--accent);color:var(--accent)}
.ev.own.sh .shic{display:inline-flex;margin-right:4px;vertical-align:-1px;opacity:.75}

.prow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--border2)}

.fres{margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#FAFBFC}

.fcard:hover{border-color:#C9D5EA;background:#FBFCFE}
.fcb{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.35}
.fcm{display:flex;align-items:center;gap:4px;flex:none}
.handleform{display:flex;align-items:center;gap:8px}
.handleform .at{font-family:'Kanit',sans-serif;font-size:17px;color:var(--muted)}

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayIso(){return iso(new Date())}
function parse(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function mondayOf(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function monthStart(s){return s.slice(0,8)+'01'}
function addMonths(s,n){const d=parse(monthStart(s));d.setMonth(d.getMonth()+n);return iso(d)}
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_S=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_L=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtShort(s){if(!s)return '';const d=parse(s);return MON_S[d.getMonth()]+' '+d.getDate()}
function fmtDate(s){if(!s)return '';const d=parse(s);return MON_S[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()}
function fmtLong(s){const d=parse(s);return DAYS[d.getDay()]+', '+MON_L[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()}
function dayName(s){return DAYS[parse(s).getDay()]}
function weekLabel(mon){const a=parse(mon),b=parse(addDays(mon,6));
  if(a.getMonth()===b.getMonth())return MON_S[a.getMonth()]+' '+a.getDate()+'–'+b.getDate()+', '+b.getFullYear();
  if(a.getFullYear()===b.getFullYear())return MON_S[a.getMonth()]+' '+a.getDate()+' – '+MON_S[b.getMonth()]+' '+b.getDate()+', '+b.getFullYear();
  return fmtDate(mon)+' – '+fmtDate(addDays(mon,6))}
function stable(v){if(v===null||typeof v!=='object')return JSON.stringify(v);
  if(Array.isArray(v))return '['+v.map(stable).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}'}
const isMobile=()=>window.matchMedia('(max-width:860px)').matches;

/* ---------- icons ---------- */
const IC={
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 cal:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 20.5"/><path d="M8.5 7.5h7M8.5 11h5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
 left:'<path d="m15 18-6-6 6-6"/>',
 right:'<path d="m9 18 6-6-6-6"/>',
 star:'<path d="m12 3.2 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
 logout:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
 note:'<path d="M6 3.5h12v17H6z"/><path d="M9 8.5h6M9 12h6M9 15.5h3"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
 check2:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/>',
 redo:'<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>',
 flame:'<path d="M12 3c.8 3.4 5 5.6 5 10.3A5 5 0 0 1 7 13.3c0-2.6 1.6-4 2.6-5.2.3 1.6 1 2.5 2 2.9C11.1 8.7 11 5.6 12 3z"/>',
 bolt:'<path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z"/>',
 up:'<path d="m6 15 6-6 6 6"/>',
 grid:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M9 9v12M15 9v12M3 15h18M8 2.5v3M16 2.5v3"/>',
 down:'<path d="m6 9 6 6 6-6"/>',
 smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14.2c.9 1.3 2.1 2 3.5 2s2.6-.7 3.5-2"/><path d="M9 9.8h.01M15 9.8h.01" stroke-width="2.6"/>',
 list:'<path d="M5 7h14M5 12h14M5 17h14"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.6 3.6-5.5 6.5-5.5s5.5 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/>',
 qr:'<rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="14.5" y="3.5" width="6" height="6" rx="1"/><rect x="3.5" y="14.5" width="6" height="6" rx="1"/><path d="M14.5 14.5h2.5v2.5M20.5 14.5v.01M14.5 20.5h.01M17.5 20.5h3v-3"/>',
 share:'<path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/>',
 block:'<circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/>',
 more:'<circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/>'
};
const ic=(n,s)=>{s=s||18;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'};

/* Eisenhower quadrants, laid out LU, RU, LL, RL */
const QUADS={iu:{l:'Important & Urgent',c:'iu',r:0,icon:'flame'},i:{l:'Important',c:'i',r:1,icon:'cal'},u:{l:'Urgent',c:'u',r:2,icon:'bolt'},s:{l:'Someday',c:'s',r:3,icon:'list'}};
const QORDER=['iu','i','u','s'];
const qOf=t=>QUADS[t.q]?t.q:({high:'iu',medium:'i',low:'s'}[t.priority]||'i');
const pr=t=>QUADS[qOf(t)];
const MOODS=[[1,'😣','Awful'],[2,'🙁','Not great'],[3,'😐','Okay'],[4,'🙂','Good'],[5,'😄','Great']];
const ROUTES=['dashboard','daily','weekly','calendar','goals','friends','friend','dreview','dsetup','review','account'];
const NAV=[['dashboard','Dashboard','Home','home'],['planner','Multiview Planner','Planner','cal'],['goals','Goals','Goals','target'],['friends','Friends','Friends','users'],['dreview','Daily Review','Review','smile'],['review','Weekly Review','Weekly R.','book'],['account','Settings','Settings','gear']];

/* ---------- state ---------- */
const T0=todayIso();
const S={mode:'loading',col:null,uid:null,profile:null,
  tasks:new Map(),goals:new Map(),focus:new Map(),reviews:new Map(),days:new Map(),photos:new Map(),events:new Map(),drcfg:null,frcfg:null,wx:{},reviewDay:T0,
  route:'dashboard',dailyDate:T0,weekStart:mondayOf(T0),weekSel:T0,calMonth:monthStart(T0),reviewWeek:mondayOf(T0),
  goalFilter:'active',drafts:{},deleting:false,loadTimer:null,rvTimer:null,user:null,unsub:null,authError:'',authView:'signin',pendingName:''};
/* Firebase project pv-planner; planner data lives at users/{uid}/planner/{doc} */
const FB_VERSION='10.12.2';
const FIREBASE={ /* paste the firebaseConfig values from Firebase Console → Project settings → Your apps */
  apiKey:'AIzaSyD-LC4OMfyyVR4KPTYB-aYLnIXwnEPNtMA',authDomain:'pv-planner-96e2b.firebaseapp.com',projectId:'pv-planner-96e2b',storageBucket:'pv-planner-96e2b.firebasestorage.app',messagingSenderId:'300153420589',appId:'1:300153420589:web:c05d70fe70487fa7f071a4'};
const PLANNER_PATH=uid=>['users',uid,'planner'];
let FB=null;

/* ---------- storage (db) ---------- */
const Q={};
function enqueue(id,fn){
  const run=async()=>{
    try{await fn()}
    catch(e){
      if(e&&(e.code==='unavailable'||e.code==='deadline-exceeded')){await sleep(400+Math.random()*800);try{await fn();return}catch(e2){writeErr(e2);throw e2}}
      writeErr(e);throw e;
    }
  };
  const p=(Q[id]||Promise.resolve()).catch(()=>{}).then(run);
  Q[id]=p;
  return p.then(()=>true,()=>false);
}
function save(id,data){return enqueue(id,()=>S.col.doc(id).set(data))}
function removeDoc(id){return enqueue(id,()=>S.col.doc(id).delete())}
function writeErr(e){
  const c=e&&e.code;
  console.warn('write failed',e);
  toast(c==='permission-denied'?'Couldn’t save — no permission to write (check the Firestore rules)'
    :c==='resource-exhausted'?'Saving too often — wait a moment and try again'
    :c==='invalid-argument'?'Invalid data — couldn’t save':'Couldn’t save — please try again');
}
const strip=o=>{const c=Object.assign({},o);delete c.id;return c};

/* tasks */
const allTasks=()=>[...S.tasks.values()].concat(sharedTasks());
const tasksOn=d=>allTasks().filter(t=>t.date===d);
function tasksInWeek(mon){const end=addDays(mon,6);return allTasks().filter(t=>t.date>=mon&&t.date<=end)}
const sortTasks=(a,b)=>(!!b.star-!!a.star)||(pr(a).r-pr(b).r)||((a.createdAt||0)-(b.createdAt||0));
const sortInQuad=(a,b)=>(a.done-b.done)||(a.date<b.date?-1:a.date>b.date?1:0)||((a.start||'99')<(b.start||'99')?-1:(a.start||'99')>(b.start||'99')?1:0)||(!!b.star-!!a.star)||((a.createdAt||0)-(b.createdAt||0));
function addTask(o){
  const id='t_'+rid(),now=Date.now();
  const t={title:o.title,date:o.date||todayIso(),q:QUADS[o.q]?o.q:'i',notes:o.notes||'',star:!!o.star,
    goalId:o.goalId||null,msId:o.msId||null,start:o.start||'',end:o.end||'',cal:!!o.cal,done:false,doneAt:null,createdAt:now,updatedAt:now};
  S.tasks.set(id,Object.assign({},t,{id}));render();save(id,t);if(t.cal)gSchedule();return id;
}
function patchTask(id,patch){
  if(id.startsWith('k_')){const c=SO.collab.get(id);if(c&&c.owner===me()){const p={};['date','title','q','start','end','notes'].forEach(k=>{if(k in patch)p[k]=patch[k]});if(Object.keys(p).length)coSave(id,p)}return}
  const cur=S.tasks.get(id);if(!cur)return;
  const next=Object.assign(strip(cur),patch,{updatedAt:Date.now()});
  if(next.q)delete next.priority;
  S.tasks.set(id,Object.assign({},next,{id}));render();save(id,next);
  if(next.cal||cur.cal)gSchedule();
}
function toggleTask(id){const t=S.tasks.get(id);if(t)patchTask(id,{done:!t.done,doneAt:t.done?null:Date.now()})}
function deleteTask(id){
  const cur=S.tasks.get(id);if(!cur)return;
  S.tasks.delete(id);render();removeDoc(id);if(cur.cal)gSchedule();
  toast('Deleted “'+cur.title+'”',()=>{S.tasks.set(id,cur);render();save(id,strip(cur));if(cur.cal)gSchedule()});
}

/* goals */
const allGoals=()=>[...S.goals.values()].sort((a,b)=>(a.targetDate||'9999')<(b.targetDate||'9999')?-1:(a.targetDate||'9999')>(b.targetDate||'9999')?1:(a.createdAt||0)-(b.createdAt||0));
const activeGoals=()=>allGoals().filter(g=>g.status!=='done');
const linked=(gid,mid)=>allTasks().filter(t=>t.goalId===gid&&t.msId===mid).sort((a,b)=>(a.done-b.done)||(a.date<b.date?-1:1));
function msProgress(g,m){if(m.done)return 1;const lt=linked(g.id,m.id);if(!lt.length)return 0;return lt.filter(t=>t.done).length/lt.length}
function goalProgress(g){if(g.status==='done')return 1;const ms=g.milestones||[];if(!ms.length)return 0;return ms.reduce((s,m)=>s+msProgress(g,m),0)/ms.length}
function msLabel(gid,mid){const g=S.goals.get(gid);if(!g)return '';const m=(g.milestones||[]).find(x=>x.id===mid);return m?m.title:g.title}
function saveGoal(g){const id=g.id;const d=strip(clone(g));d.updatedAt=Date.now();S.goals.set(id,Object.assign({},d,{id}));render();return save(id,d)}

/* focus */
function focusItems(mon){const f=S.focus.get('f_'+mon);return f&&f.items?clone(f.items):[]}

/* ---------- snapshot ---------- */
function sig(){const f=m=>[...m.values()].sort((a,b)=>a.id<b.id?-1:1);return stable([S.profile,f(S.tasks),f(S.goals),f(S.focus),f(S.reviews),f(S.days),f(S.events),[...S.photos.keys()].sort(),S.drcfg,S.frcfg])}
function onSnap(snap){
  clearTimeout(S.loadTimer);
  if(S.deleting)return;
  const before=S.mode==='app'?sig():'';
  const n={tasks:new Map(),goals:new Map(),focus:new Map(),reviews:new Map(),days:new Map(),photos:new Map(),events:new Map(),drcfg:null,frcfg:null,profile:null};
  snap.docs.forEach(d=>{
    const v=d.data();if(!v)return;const id=d.id;
    if(id==='profile')n.profile=v;
    else if(id.startsWith('t_'))n.tasks.set(id,Object.assign({},v,{id}));
    else if(id.startsWith('g_'))n.goals.set(id,Object.assign({},v,{id}));
    else if(id.startsWith('f_'))n.focus.set(id,Object.assign({},v,{id}));
    else if(id.startsWith('r_'))n.reviews.set(id,Object.assign({},v,{id}));
    else if(id.startsWith('d_'))n.days.set(id,Object.assign({},v,{id}));
    else if(id.startsWith('p_'))n.photos.set(id,Object.assign({},v,{id}));
    else if(id==='drcfg')n.drcfg=Object.assign({},v,{id});
    else if(id==='friendcfg')n.frcfg=Object.assign({},v,{id});
    else if(id.startsWith('e_'))n.events.set(id,Object.assign({},v,{id}));
  });
  S.tasks=n.tasks;S.goals=n.goals;S.focus=n.focus;S.reviews=n.reviews;S.days=n.days;S.photos=n.photos;S.drcfg=n.drcfg;S.frcfg=n.frcfg;S.events=n.events;
  const definitive=!snap.metadata.fromCache;
  if(n.profile)S.profile=n.profile;
  else if(definitive||S.mode==='app'){if(!S.profile||S.profile.uid!==S.user.uid)createProfile()}
  else return; /* cached and empty: wait for the server */
  if(S.mode!=='app'){enterApp();return}
  if(sig()!==before){render();gSchedule(3000);publishSoon();syncPub()}
}
function createProfile(){
  const u=S.user;
  const prof={uid:u.uid,name:(S.pendingName||u.displayName||(u.email||'').split('@')[0]||'there'),email:u.email||'',createdAt:Date.now()};S.pendingName='';
  S.profile=prof;save('profile',prof);syncPub();
}
function onSnapErr(e){
  clearTimeout(S.loadTimer);
  const c=e&&e.code;
  if(c==='permission-denied')stateScreen('No access to your data yet','The Firestore security rules don’t allow users/{uid}/planner yet. Add the rules from this site’s README, then reload.',false,true);
  else stateScreen('Couldn’t connect to your data','Check your internet connection, then reload the page.',false,true);
}

async function boot(){
  try{const h=(location.hash||'').slice(1);if(h.startsWith('add='))sessionStorage.setItem('pvadd',h.slice(4))}catch(e){}
  if(!FIREBASE.apiKey){stateScreen('Setup needed','Add the Firebase config to index.html to start using Personal Planner.');return}
  try{
    const b='https://www.gstatic.com/firebasejs/'+FB_VERSION+'/';
    const [ap,au,fs]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
    const app=ap.initializeApp(FIREBASE,'pv-planner'); /* own app name = own sign-in, separate from the other sites on bankypp.github.io */
    let db;
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()}),ignoreUndefinedProperties:true})}
    catch(e){db=fs.getFirestore(app)}
    FB={au,fs,auth:au.getAuth(app),db};
    try{await au.setPersistence(FB.auth,au.browserLocalPersistence)}catch(e){}
    au.getRedirectResult(FB.auth).catch(e=>{S.authError=authMsg(e);if(S.mode==='auth')showLogin(S.authView)});
    au.onAuthStateChanged(FB.auth,u=>{
      if(S.unsub){S.unsub();S.unsub=null}
      S.tasks=new Map();S.goals=new Map();S.focus=new Map();S.reviews=new Map();S.profile=null;S.frcfg=null;S.drafts={};S.frSearch=null;socialStop();
      if(!u){S.user=null;S.col=null;showLogin(S.authView==='signup'?'signup':'signin');return}
      S.user=u;S.authView='signin';S.authError='';
      const colRef=fs.collection(FB.db,...PLANNER_PATH(u.uid));
      S.col={doc:id=>({set:d=>fs.setDoc(fs.doc(colRef,id),d),delete:()=>fs.deleteDoc(fs.doc(colRef,id))})};
      loadingScreen('Loading your planner…');
      S.loadTimer=setTimeout(()=>{const p=$('#root .state p');if(S.mode==='loading'&&p)p.textContent='Still connecting — check your internet. The page will continue on its own once it connects.'},10000);
      S.unsub=fs.onSnapshot(colRef,onSnap,onSnapErr);
      socialStart(u);
    });
  }catch(e){
    console.error(e);
    stateScreen('Couldn’t load the app','Check your internet connection, then reload the page.');
  }
}
function authMsg(e){
  const c=(e&&e.code)||'';
  const bad='Incorrect email or password.';
  const M={'auth/popup-closed-by-user':'','auth/cancelled-popup-request':'',
    'auth/invalid-credential':bad,'auth/wrong-password':bad,'auth/user-not-found':bad,'auth/invalid-login-credentials':bad,
    'auth/invalid-email':'That email address doesn’t look right.','auth/missing-password':'Please enter your password.',
    'auth/email-already-in-use':'An account with this email already exists. Sign in instead — or use “Continue with Google” if you signed up with Google.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/too-many-requests':'Too many attempts. Please wait a few minutes and try again.',
    'auth/network-request-failed':'Can’t reach the internet. Please try again.',
    'auth/unauthorized-domain':'This domain isn’t authorized in Firebase yet (Authentication → Settings → Authorized domains).',
    'auth/operation-not-allowed':'This sign-in method isn’t enabled in Firebase yet (Authentication → Sign-in method).',
    'auth/account-exists-with-different-credential':'This email already uses a different sign-in method.',
    'auth/user-disabled':'This account has been disabled.'};
  return Object.prototype.hasOwnProperty.call(M,c)?M[c]:'Sign-in failed ('+(c||'unknown error')+').';
}

  }

async function doSignin(f){
  const el=f.elements,email=el.em.value.trim(),pw=el.pw.value;
  if(!emailOk(email))return setAuthErr('Please enter a valid email address.');
  if(!pw)return setAuthErr('Please enter your password.');
  setAuthErr('');busy(f,true);
  try{await FB.au.signInWithEmailAndPassword(FB.auth,email,pw)}catch(e){busy(f,false);setAuthErr(authMsg(e))}
}
async function doSignup(f){
  const el=f.elements,name=el.nm.value.trim(),email=el.em.value.trim(),pw=el.pw.value,pw2=el.pw2.value;
  if(!name)return setAuthErr('Please enter your name.');
  if(!emailOk(email))return setAuthErr('Please enter a valid email address.');
  if(pw.length<6)return setAuthErr('Password must be at least 6 characters.');
  if(pw!==pw2)return setAuthErr('Passwords don’t match.');
  setAuthErr('');busy(f,true);S.pendingName=name;
  try{const cred=await FB.au.createUserWithEmailAndPassword(FB.auth,email,pw);try{await FB.au.updateProfile(cred.user,{displayName:name})}catch(e){}}
  catch(e){S.pendingName='';busy(f,false);setAuthErr(authMsg(e))}
}
async function doReset(f){
  const email=f.elements.em.value.trim();
  if(!emailOk(email))return setAuthErr('Please enter a valid email address.');
  setAuthErr('');busy(f,true);
  try{await FB.au.sendPasswordResetEmail(FB.auth,email);showLogin('signin','If an account exists for '+email+', a reset link is on its way. Check your inbox (and spam folder).')}
  catch(e){busy(f,false);setAuthErr(authMsg(e))}
}

async function gConnect(){

async function gApi(path,opt){
  opt=opt||{};
  if(!gHasTok())throw {code:'auth'};
  const r=await fetch(path.startsWith('http')?path:GAPI+path,{method:opt.method||'GET',headers:Object.assign({Authorization:'Bearer '+G.token},opt.body?{'Content-Type':'application/json'}:{}),body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){gClearToken();render();throw {code:'auth'}}
  if(r.status===204)return null;
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw {code:r.status,body:j};
  return j;
}

function gRange(from,to){ /* inclusive dates */
  if(!gReady())return;
  const cfg=gcalCfg();const ids=(cfg.show||[]).filter(id=>id!==cfg.pvCalId);
  const key=from+'|'+to;
  ids.forEach(id=>{
    const k=id+'|'+key,c=G.events.get(k);
    if((c&&Date.now()-c.at<5*60000)||G.inflight.has(k))return;
    G.inflight.add(k);
    const tmin=new Date(parse(from)).toISOString(),tmax=new Date(parse(addDays(to,1))).toISOString();
    gApi('/calendars/'+encodeURIComponent(id)+'/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+encodeURIComponent(tmin)+'&timeMax='+encodeURIComponent(tmax))
      .then(j=>{G.events.set(k,{at:Date.now(),items:(j.items||[]).filter(e=>e.status!=='cancelled')});G.inflight.delete(k);render()})
      .catch(e=>{G.inflight.delete(k);if(e&&e.code!=='auth')G.events.set(k,{at:Date.now(),items:[]})});
  });
}
function evLocal(x){ /* -> {date, time} in local time */
  if(x.date)return {date:x.date,time:''};
  const d=new Date(x.dateTime);return {date:iso(d),time:pad(d.getHours())+':'+pad(d.getMinutes())};
}
function gEventsOn(d){
  if(!gReady())return [];
  const cfg=gcalCfg(),ids=(cfg.show||[]).filter(id=>id!==cfg.pvCalId);const seen=new Set(),out=[];
  for(const [k,v] of G.events){const cid=k.split('|')[0];if(!ids.includes(cid))continue;
    const cal=(G.list||[]).find(c=>c.id===cid)||{name:'',color:'#7C8794'};
    v.items.forEach(e=>{if(seen.has(cid+e.id))return;
      const s=evLocal(e.start),en=evLocal(e.end);const allDay=!!e.start.date;
      const inside=allDay?(s.date<=d&&d<en.date):(s.date<=d&&d<=en.date&&!(en.date===d&&en.time==='00:00'&&s.date!==d));
      if(!inside)return;seen.add(cid+e.id);
      out.push({title:e.summary||'(No title)',allDay,time:allDay?'':(s.date===d?s.time:'00:00'),end:allDay?'':(en.date===d?en.time:''),color:e.backgroundColor||cal.color,cal:cal.name,link:e.htmlLink||''});
    })}
  return out.sort((a,b)=>(b.allDay-a.allDay)||(a.time<b.time?-1:a.time>b.time?1:0));
}

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function evBody(t){
  const q=qOf(t);let start,end;
  if(t.start){const e=t.end&&t.end>t.start?t.end:hhmmPlus(t.start,60);start={dateTime:t.date+'T'+t.start+':00',timeZone:TZ};end={dateTime:t.date+'T'+e+':00',timeZone:TZ}}
  else{start={date:t.date};end={date:addDays(t.date,1)}}
  const b={summary:(t.done?'✓ ':'')+t.title,description:QUADS[q].l+(t.notes?'\n\n'+t.notes:'')+'\n\n— PV Planner',start,end,status:'confirmed',colorId:QCOLOR[q],transparency:t.start?'opaque':'transparent'};
  b.extendedProperties={private:{pv:'1',task:t.id,sig:hash(stable(b))}};
  return b;
}
async function ensurePvCal(){
  const cfg=gcalCfg();
  if(cfg.pvCalId){
    if(G.pvChecked)return cfg.pvCalId;
    try{await gApi('/calendars/'+encodeURIComponent(cfg.pvCalId));G.pvChecked=true;return cfg.pvCalId}catch(e){if(e.code==='auth')throw e;if(e.code!==404&&e.code!==403)throw e}
  }
  const c=await gApi('/calendars',{method:'POST',body:{summary:'PV Planner',description:'Tasks from PV Planner',timeZone:TZ}});
  await saveGcal({pvCalId:c.id});G.pvChecked=true;return c.id;
}
async function upsertEv(cal,id,b){
  const base='/calendars/'+encodeURIComponent(cal)+'/events';
  try{await gApi(base+'/'+id,{method:'PUT',body:b});return}catch(e){if(e.code==='auth')throw e;if(e.code!==404&&e.code!==410)throw e}
  try{await gApi(base,{method:'POST',body:Object.assign({id},b)})}catch(e){if(e.code===409)await gApi(base+'/'+id,{method:'PATCH',body:b});else throw e}
}
function gSchedule(ms){if(!gcalOn())return;clearTimeout(G.timer);G.timer=setTimeout(gSync,ms||1500)}
async function gSync(){
  if(!gReady())return;
  if(G.syncing){G.again=true;return}
  G.syncing=true;G.err='';
  try{
    const cal=await ensurePvCal();
    const ex=new Map();let tok='';
    do{const j=await gApi('/calendars/'+encodeURIComponent(cal)+'/events?maxResults=2500&showDeleted=false&privateExtendedProperty='+encodeURIComponent('pv=1')+(tok?'&pageToken='+encodeURIComponent(tok):''));(j.items||[]).forEach(e=>ex.set(e.id,e));tok=j.nextPageToken||''}while(tok);
    const want=new Map();[...S.tasks.values()].forEach(t=>{if(t.cal&&t.date)want.set(evId(t.id),evBody(t))});[...S.events.values()].forEach(e=>{if(e.cal&&e.date)want.set(evId(e.id),evBodyE(e))});coList().forEach(c=>{if(c.kind==='event'&&c.owner===me()&&c.cal&&c.date)want.set(evId(c.id),evBodyE(c))});
    for(const [id,b] of want){const e=ex.get(id);if(!e||!e.extendedProperties||!e.extendedProperties.private||e.extendedProperties.private.sig!==b.extendedProperties.private.sig)await upsertEv(cal,id,b)}
    for(const [id] of ex)if(!want.has(id)){try{await gApi('/calendars/'+encodeURIComponent(cal)+'/events/'+id,{method:'DELETE'})}catch(e){if(e.code==='auth')throw e;if(e.code!==404&&e.code!==410)throw e}}
    G.last=Date.now();
  }catch(e){if(e&&e.code!=='auth'){G.err='Last sync failed'+(e.code?' ('+e.code+')':'');console.warn('gcal sync',e)}}
  finally{G.syncing=false;if(S.route==='account')render();if(G.again){G.again=false;gSchedule(800)}}
}
function gDisconnect(){
  const t=G.token;gClearToken();G.list=null;G.events.clear();G.pvChecked=false;
  try{if(t&&window.google&&google.accounts)google.accounts.oauth2.revoke(t,()=>{})}catch(e){}
  saveGcal({enabled:false});render();toast('Google Calendar disconnected');
}

const EV_COLORS=[['#3F7AE0','9'],['#E0584F','11'],['#C99A06','5'],['#3E9B5C','10'],['#8B5CF6','3'],['#E07AB0','4'],['#14A3B8','7'],['#7C8794','8']];
const REPEATS=[['none','Does not repeat'],['daily','Every day'],['weekly','Every week'],['monthly','Every month'],['yearly','Every year']];
function isOccStart(e,s){
  if(s<e.date||(e.until&&s>e.until))return false;
  switch(e.repeat){case 'daily':return true;case 'weekly':return parse(s).getDay()===parse(e.date).getDay();
    case 'monthly':return parse(s).getDate()===parse(e.date).getDate();case 'yearly':return s.slice(5)===e.date.slice(5);default:return s===e.date}
}
function occursOn(e,d){
  if(!e.date||d<e.date)return false;
  const span=e.allDay&&e.endDate&&e.endDate>e.date?Math.round((parse(e.endDate)-parse(e.date))/864e5):0;
  for(let k=0;k<=span;k++){if(isOccStart(e,addDays(d,-k)))return true}
  return false;
}
function myEventsOn(d){return ownEventsOn(d).concat(coEventsOn(d))}
function ownEventsOn(d){return [...S.events.values()].filter(e=>occursOn(e,d)).map(e=>({own:true,id:e.id,title:e.title,allDay:!!e.allDay||!e.start,time:e.allDay?'':(e.start||''),end:e.allDay?'':(e.end||''),color:e.color||EV_COLORS[0][0],cal:e.location||'',rep:!!e.repeat&&e.repeat!=='none'}))}

function newHead(kind){
  return '<div class="mh"><div class="tabs" style="margin:0"><button type="button" class="'+(kind==='task'?'active':'')+'" data-act="new-kind" data-k="task">Task</button><button type="button" class="'+(kind==='event'?'active':'')+'" data-act="new-kind" data-k="event">Event</button></div><button type="button" class="ibtn" data-act="close-modal" aria-label="Close">'+ic('x',18)+'</button></div>'

function evBodyE(e){
  let start,end;
  if(e.allDay||!e.start){start={date:e.date};end={date:addDays(e.allDay&&e.endDate&&e.endDate>e.date?e.endDate:e.date,1)}}
  else{const en=e.end&&e.end>e.start?e.end:hhmmPlus(e.start,60);start={dateTime:e.date+'T'+e.start+':00',timeZone:TZ};end={dateTime:e.date+'T'+en+':00',timeZone:TZ}}
  const b={summary:e.title,description:(e.notes?e.notes+'\n\n':'')+'— PV Planner',location:e.location||'',start,end,status:'confirmed',colorId:(EV_COLORS.find(c=>c[0]===e.color)||EV_COLORS[0])[1]};
  if(e.repeat&&e.repeat!=='none')b.recurrence=['RRULE:FREQ='+e.repeat.toUpperCase()+(e.until?';UNTIL='+e.until.replace(/-/g,'')+(start.date?'':'T235959Z'):'')];
  b.extendedProperties={private:{pv:'1',ev:e.id,sig:hash(stable(b))}};
  return b;
}
function saveEvent(id,data){

  const doc=Object.assign({},cur?strip(cur):{createdAt:now},data,{updatedAt:now});

function deleteEvent(id){

  toast('Deleted “'+cur.title+'”',()=>{S.events.set(id,cur);render();save(id,strip(cur));if(cur.cal)gSchedule()});

const PLANNER_VIEWS=['daily','weekly','calendar'];
function lastPlanner(){let v='';try{v=localStorage.getItem('pv-lastview')||''}catch(e){}if(v==='month'||v==='year'){S.calMode=v;return 'calendar'}return v==='weekly'?'weekly':'daily'}
function rememberView(){if(!PLANNER_VIEWS.includes(S.route))return;try{localStorage.setItem('pv-lastview',S.route==='calendar'?(S.calMode||'month'):S.route)}catch(e){}}
function go(route){
  if(route==='planner')route=lastPlanner();
  if(!ROUTES.includes(route))route='dashboard';
  S.route=route;rememberView();
  try{if(location.hash!=='#'+route)location.hash=route}catch(e){}
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(S.mode==='app'&&h.startsWith('add=')){go('friends');openInvite(h.slice(4));return}if(S.mode==='app'&&ROUTES.includes(h)&&h!==S.route){S.route=h;render();window.scrollTo(0,0)}});

function render(){
  if(S.mode!=='app')return;
  const view=$('#view');if(!view)return;
  S.rendering=true;
  const ae=document.activeElement;let fk=null,ss=null,se=null,st=0;
  if(ae&&ae.dataset&&ae.dataset.k&&view.contains(ae)){fk=ae.dataset.k;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}st=ae.scrollTop}
  try{view.innerHTML=gBanner()+(VIEWS[S.route]||VIEWS.dashboard)()}finally{S.rendering=false}
  view.querySelectorAll('[data-k]').forEach(el=>{if(Object.prototype.hasOwnProperty.call(S.drafts,el.dataset.k))el.value=S.drafts[el.dataset.k]});
  if(fk){const el=[...view.querySelectorAll('[data-k]')].find(x=>x.dataset.k===fk);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}el.scrollTop=st}}
  document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===S.route||(b.dataset.route==='planner'&&PLANNER_VIEWS.includes(S.route))));
  const nm=(S.profile&&S.profile.name)||'';
  const a=$('#me-av'),n=$('#me-name');if(n)n.textContent=nm;
  if(a){const ph=pubWant().photo,k=ph+'|'+nm;if(a.dataset.k!==k){a.dataset.k=k;a.innerHTML=ph?'<img src="'+esc(ph)+'" alt="" referrerpolicy="no-referrer">':esc((nm.trim()[0]||'?').toUpperCase())}}
  const nb=frBadge();document.querySelectorAll('.frbadge').forEach(b=>{b.textContent=nb>9?'9+':String(nb);b.hidden=!nb});
  const fab=$('.fab');if(fab)fab.classList.toggle('hide',!['daily','weekly'].includes(S.route));
}

function quickAdd(key,date,mini){
  if(mini)return '<form class="qa mini" data-form="qa" data-date="'+date+'" data-key="'+key+'"><input type="text" data-k="'+key+'" name="title" placeholder="+ Add task" autocomplete="off" maxlength="200" aria-label="Add task"></form>';
  return '<form class="qa" data-form="qa" data-date="'+date+'" data-key="'+key+'">'
   +'<input type="text" data-k="'+key+'" name="title" placeholder="Add a task…" autocomplete="off" maxlength="200" aria-label="Task name">'
   +'<select data-k="'+key+'-p" name="prio" aria-label="Priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>'
   +'<button class="btn primary" type="submit">'+ic('plus',16)+'<span>Add</span></button></form>';
}
const progBar=(v,ok)=>'<div class="bar'+(ok?' ok':'')+'"><i style="width:'+Math.round(v*100)+'%"></i></div>';
function topTasks(){const td=todayIso();return allTasks().filter(t=>!t.done&&t.date<=td).sort((a,b)=>(!!b.star-!!a.star)||(pr(a).r-pr(b).r)||(a.date<b.date?-1:a.date>b.date?1:0)||((a.createdAt||0)-(b.createdAt||0))).slice(0,3)}
function focusCard(mon,title){
  const items=focusItems(mon);
  return '<section class="card"><div class="ch"><h2>'+(title||'This week’s focus')+'</h2><span class="fine">'+items.filter(i=>i.done).length+'/'+items.length+'</span></div>'
   +(items.length?items.map(i=>'<div class="fitem'+(i.done?' done':'')+'"><button class="chk'+(i.done?' on':'')+'" data-act="focus-toggle" data-w="'+mon+'" data-i="'+i.id+'" aria-label="Mark as done">'+ic('check',12)+'</button><div class="ft">'+esc(i.text)+'</div><button class="ibtn" data-act="focus-del" data-w="'+mon+'" data-i="'+i.id+'" aria-label="Remove">'+ic('x',15)+'</button></div>').join('')
     :'<p class="empty" style="padding-top:0">No focus set for this week yet</p>')
   +'<form class="qa mini" data-form="focus-add" data-w="'+mon+'" data-key="focus-'+mon+'"><input type="text" data-k="focus-'+mon+'" name="text" placeholder="+ Add something to focus on" autocomplete="off" maxlength="200" aria-label="Add focus item"></form></section>';
}
function weekNav(prefix,mon){
  const cur=mondayOf(todayIso());
  return '<div class="navrow"><button class="ibtn" data-act="'+prefix+'-prev" aria-label="Previous week" style="border:1px solid var(--border);background:#fff">'+ic('left',18)+'</button>'
   +'<span class="lab">'+weekLabel(mon)+'</span>'
   +'<button class="ibtn" data-act="'+prefix+'-next" aria-label="Next week" style="border:1px solid var(--border);background:#fff">'+ic('right',18)+'</button>'
   +(mon!==cur?'<button class="btn sm" data-act="'+prefix+'-this">This week</button>':'')+'</div>';
}

/* ---------- views ---------- */
const VIEWS={};
VIEWS.dashboard=function(){
  const td=todayIso(),todays=tasksOn(td).sort(sortTasks),done=todays.filter(t=>t.done).length;
  const overdue=allTasks().filter(t=>!t.done&&t.date<td);
  const mon=mondayOf(td),wk=tasksInWeek(mon),wkDone=wk.filter(t=>t.done).length,pct=wk.length?Math.round(wkDone/wk.length*100):0;
  const goals=activeGoals(),top=topTasks();
  const name=(S.profile&&S.profile.name)||'';
  const todo=todays.filter(t=>!t.done),fin=todays.filter(t=>t.done);
  let wrows='';
  for(let i=0;i<7;i++){const d=addDays(mon,i),ts=tasksOn(d),dn=ts.filter(t=>t.done).length;
    wrows+='<div class="wrow'+(d===td?' today':'')+'"><span class="wl">'+moodBtn(d,20)+'<span>'+DAYS_S[parse(d).getDay()]+' '+(dayEntry(d).star?MON_S[parse(d).getMonth()]+' '+starNum(parse(d).getDate(),24):fmtShort(d))+'</span></span>'+progBar(ts.length?dn/ts.length:0,ts.length&&dn===ts.length)+'<span class="wc">'+dn+'/'+ts.length+'</span></div>'}
  return '<header class="ph"><div><h1>'+greeting()+', '+esc(name)+'</h1><p class="sub dsub">'+moodBtn(td,22)+(dayEntry(td).star?starNum(parse(td).getDate(),24):'')+fmtLong(td)+'</p></div></header>'
   +'<div class="stats">'
   +'<button class="card stat" data-act="nav" data-route="daily"><div class="lbl2">Today</div><div class="val">'+done+'/'+todays.length+'</div><div class="hint">tasks done</div></button>'
   +'<button class="card stat'+(overdue.length?' warn':'')+'" data-act="nav" data-route="daily"><div class="lbl2">Overdue</div><div class="val">'+overdue.length+'</div><div class="hint">tasks pending</div></button>'
   +'<button class="card stat" data-act="nav" data-route="weekly"><div class="lbl2">This week</div><div class="val">'+pct+'%</div><div class="hint">'+wkDone+'/'+wk.length+' tasks</div></button>'
   +'<button class="card stat" data-act="nav" data-route="goals"><div class="lbl2">Goals</div><div class="val">'+goals.length+'</div><div class="hint">in progress</div></button>'
   +'</div>'
   +'<div class="grid2"><div class="col">'
   +'<section class="card"><div class="ch"><h2>Top 3 for today</h2></div>'
   +(top.length?'<div class="tlist">'+top.map((t,i)=>taskRow(t,{num:i+1})).join('')+'</div>'
      :'<p class="empty">'+(todays.length?'All of today’s tasks are done 🎉':'No tasks for today yet')+'</p>')
   +'<p class="fine" style="margin-top:8px">Pinned tasks first, then Important & Urgent → Important → Urgent → Someday</p></section>'
   +'<section class="card"><div class="ch"><h2>Today’s tasks</h2><button class="link" data-act="nav" data-route="daily">Open daily planner '+ic('arrow',14)+'</button></div>'
   +quadBoard(todo.concat(overdue),{date:td,key:'qa-dash'})
   +(fin.length?'<div class="sec">Completed today ('+fin.length+')</div><div class="tlist">'+fin.map(t=>taskRow(t,{compact:true})).join('')+'</div>':'')
   +'</section></div>'
   +'<div class="col">'
   +((gReady()&&gRange(td,td),true)?'<section class="card"><div class="ch"><h2>Today’s schedule</h2><button class="link" data-act="new-event" data-date="'+td+'">'+ic('plus',14)+'Event</button></div>'+gScheduleHTML(td)+'</section>':'')
   +'<section class="card"><div class="ch"><h2>This week’s progress</h2><button class="link" data-act="nav" data-route="weekly">View week '+ic('arrow',14)+'</button></div>'
   +'<div class="prog" style="margin-bottom:12px">'+progBar(wk.length?wkDone/wk.length:0)+'<span class="pct">'+pct+'%</span></div>'+wrows+'</section>'
   +focusCard(mon)
   +'<section class="card"><div class="ch"><h2>Active goals</h2><button class="link" data-act="nav" data-route="goals">All goals '+ic('arrow',14)+'</button></div>'
   +(goals.length?goals.slice(0,4).map(g=>{const v=goalProgress(g);const nx=(g.milestones||[]).find(m=>!m.done);
      return '<div class="goal-mini"><div class="gt"><b>'+esc(g.title)+'</b><span class="fine">'+Math.round(v*100)+'%</span></div>'+progBar(v,v>=1)
       +(nx?'<p class="fine" style="margin-top:6px">Next: '+esc(nx.title)+'</p>':'')+'</div>'}).join('')

VIEWS.daily=function(){
  const d=S.dailyDate,td=todayIso();
  const list=tasksOn(d).sort(sortTasks),todo=list.filter(t=>!t.done),fin=list.filter(t=>t.done);
  const overdue=d===td?allTasks().filter(t=>!t.done&&t.date<td).sort((a,b)=>a.date<b.date?-1:1):[];
  return '<header class="ph"><div><h1>Daily Planner</h1><p class="sub">'+fmtLong(d)+(d===td?' · Today':'')+'</p></div>'
   +'<div class="navrow"><button class="ibtn" data-act="day-prev" aria-label="Previous day" style="border:1px solid var(--border);background:#fff">'+ic('left',18)+'</button>'
   +'<input type="date" data-act="pick-day" value="'+d+'" aria-label="Pick a date">'
   +'<button class="ibtn" data-act="day-next" aria-label="Next day" style="border:1px solid var(--border);background:#fff">'+ic('right',18)+'</button>'
   +(d!==td?'<button class="btn sm" data-act="day-today">Today</button>':'')+viewTabs('day')+'</div></header>'
   +'<section class="card" style="max-width:980px">'
   +'<div class="prog" style="margin-bottom:14px"><span class="fine" style="min-width:110px">'+fin.length+' of '+list.length+' done</span>'+progBar(list.length?fin.length/list.length:0,list.length&&fin.length===list.length)+'</div>'
   +(overdue.length?'<div class="notice late-note"><span>'+overdue.length+' overdue '+(overdue.length===1?'task is':'tasks are')+' shown in red below</span><button class="link" data-act="move-all-today">Move all to today</button></div>':'')
   +((gReady()&&gRange(d,d),true)?'<div class="sec" style="margin-top:0"><span>Schedule</span><button class="link" data-act="new-event" data-date="'+d+'">'+ic('plus',14)+'Add event</button></div>'+gScheduleHTML(d)+'<div class="sec">Tasks</div>':'')
   +quadBoard(list.concat(overdue),{date:d,key:'qa-day-'+d,showDone:true})
   +'<p class="fine" style="margin-top:10px">Click a task to edit its notes, due date, quadrant, or linked goal</p>'
   +'</section>';
};

function miniCal(){
  const m=S.calMonth,first=parse(m),start=mondayOf(m),td=todayIso(),ws=S.weekStart,we=addDays(ws,6);
  const counts={};allTasks().forEach(t=>{const c=counts[t.date]||(counts[t.date]={n:0,d:0});c.n++;if(t.done)c.d++});
  let cells='';
  for(let i=0;i<42;i++){const d=addDays(start,i),dd=parse(d);const c=counts[d];
    const cls=['cal-d'];if(dd.getMonth()!==first.getMonth())cls.push('out');if(d>=ws&&d<=we)cls.push('inweek');if(d===td)cls.push('today');if(d===S.weekSel)cls.push('sel');
    cells+='<button class="'+cls.join(' ')+'" data-act="cal-pick" data-date="'+d+'" aria-label="'+fmtLong(d)+'">'+dd.getDate()+(c?'<span class="dot'+(c.d===c.n?' alldone':'')+'"></span>':'')+'</button>';
    if(i>=34&&parse(addDays(start,i+1)).getMonth()!==first.getMonth()&&(i+1)%7===0)break;
  }
  return '<section class="card"><div class="cal-h"><button class="ibtn" data-act="cal-prev" aria-label="Previous month">'+ic('left',17)+'</button><b>'+MON_L[first.getMonth()]+' '+first.getFullYear()+'</b><button class="ibtn" data-act="cal-next" aria-label="Next month">'+ic('right',17)+'</button></div>'
   +'<div class="cal-grid">'+['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>'<span class="cal-wd">'+x+'</span>').join('')+cells+'</div></section>';
}
VIEWS.weekly=function(){
  const mon=S.weekStart,td=todayIso(),wk=tasksInWeek(mon),wd=wk.filter(t=>t.done).length;
  if(gReady())gRange(mon,addDays(mon,6));
  let days='';
  for(let i=0;i<7;i++){const d=addDays(mon,i),ts=tasksOn(d).sort((a,b)=>(a.done-b.done)||sortTasks(a,b)),dn=ts.filter(t=>t.done).length;
    days+='<section class="card day'+(d===td?' is-today':'')+(d<td?' is-past':'')+(d===S.weekSel?' is-sel':'')+'" id="day-'+d+'">'
     +'<div class="dh">'+moodBtn(d,22)+'<span class="dn">'+dayName(d)+'</span><span class="dd">'+(dayEntry(d).star?MON_S[parse(d).getMonth()]+' '+starNum(parse(d).getDate(),26):fmtShort(d))+'</span><span class="dc">'+dn+'/'+ts.length+'</span>'
     +'<button class="ibtn" data-act="open-day" data-date="'+d+'" title="Open in daily planner" aria-label="Open in daily planner">'+ic('arrow',16)+'</button></div>'
     +gScheduleHTML(d,true)
     +(ts.length?'<div class="tlist">'+ts.map(t=>taskRow(t,{compact:true})).join('')+'</div>':'<p class="empty" style="padding:4px 2px">Nothing planned</p>')
     +quickAdd('qa-w-'+d,d,true)+'</section>'}
  return '<header class="ph"><div><h1>Weekly Planner</h1><p class="sub">'+wk.length+' tasks · '+wd+' done</p></div><div class="navrow">'+weekNav('wk',mon)+viewTabs('week')+'</div></header>'
   +'<div class="wk-layout"><div class="wk-cal">'+miniCal()+'</div><div class="days">'+days+'</div>'
   +'<aside class="wk-aside">'
   +'<section class="card"><div class="ch" style="margin-bottom:8px"><h2>Progress</h2><span class="fine">'+wd+'/'+wk.length+'</span></div><div class="prog">'+progBar(wk.length?wd/wk.length:0,wk.length&&wd===wk.length)+'<span class="pct">'+(wk.length?Math.round(wd/wk.length*100):0)+'%</span></div></section>'
   +focusCard(mon,'Weekly focus')+'</aside></div>';
};

VIEWS.goals=function(){
  const f=S.goalFilter;
  const list=allGoals().filter(g=>f==='done'?g.status==='done':g.status!=='done'&&(f==='active'||g.horizon===f));
  const tabs=[['active','Active'],['short','Short-term'],['long','Long-term'],['done','Completed']];
  const td=todayIso();
  const cards=list.map(g=>{
    const v=goalProgress(g),ms=g.milestones||[];
    const msHtml=ms.map(m=>{const lt=linked(g.id,m.id),ld=lt.filter(t=>t.done).length;
      return '<div class="ms'+(m.done?' done':'')+'"><button class="chk" data-act="ms-toggle" data-g="'+g.id+'" data-m="'+m.id+'" aria-label="Mark milestone done">'+ic('check',14)+'</button>'
       +'<div class="msb"><div class="ttl">'+esc(m.title)+'</div>'
       +((m.due||lt.length)?'<div class="tmeta">'+(m.due?'<span class="meta'+(!m.done&&m.due<td?' late':'')+'">'+ic('cal',13)+fmtDate(m.due)+'</span>':'')+(lt.length?'<span class="meta">'+ic('link',13)+'Tasks '+ld+'/'+lt.length+'</span>':'')+'</div>':'')
       +(lt.length?'<div class="subtasks tlist">'+lt.map(t=>taskRow(t,{compact:true,showDate:true})).join('')+'</div>':'')+'</div>'
       +'<button class="ibtn" data-act="ms-addtask" data-g="'+g.id+'" data-m="'+m.id+'" title="Add a task to this milestone" aria-label="Add a task to this milestone">'+ic('plus',16)+'</button>'
       +'<button class="ibtn" data-act="ms-edit" data-g="'+g.id+'" data-m="'+m.id+'" title="Edit" aria-label="Edit milestone">'+ic('edit',15)+'</button>'
       +'<button class="ibtn" data-act="ms-del" data-g="'+g.id+'" data-m="'+m.id+'" title="Delete" aria-label="Delete milestone">'+ic('trash',15)+'</button></div>'}).join('');
    return '<section class="card goal"><div class="gh"><div style="min-width:0"><div class="gtitle"><h2>'+esc(g.title)+'</h2>'
     +'<span class="tag '+(g.horizon==='long'?'ac':'lo')+'">'+(g.horizon==='long'?'Long-term':'Short-term')+'</span>'
     +(g.status==='done'?'<span class="tag ok">Completed</span>':'')+'</div>'
     +(g.description?'<p class="gdesc">'+esc(g.description)+'</p>':'')
     +(g.targetDate?'<p class="fine" style="margin-top:4px">Target date: '+fmtDate(g.targetDate)+'</p>':'')+'</div>'
     +'<div class="gact"><button class="ibtn" data-act="goal-edit" data-g="'+g.id+'" title="Edit" aria-label="Edit goal">'+ic('edit',17)+'</button>'
     +'<button class="ibtn" data-act="goal-del" data-g="'+g.id+'" title="Delete" aria-label="Delete goal">'+ic('trash',17)+'</button></div></div>'
     +'<div class="prog">'+progBar(v,v>=1)+'<span class="pct">'+Math.round(v*100)+'%</span></div>'
     +'<div class="ms-head">Milestones ('+ms.filter(m=>m.done).length+'/'+ms.length+')</div>'
     +(msHtml||'<p class="empty" style="padding:4px 0">No milestones yet — break this goal into steps below</p>')
     +'<form class="qa mini" data-form="ms-add" data-g="'+g.id+'" data-key="ms-'+g.id+'"><input type="text" data-k="ms-'+g.id+'" name="title" placeholder="+ Add milestone" autocomplete="off" maxlength="200" aria-label="Add milestone"></form>'
     +'<div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="btn sm'+(g.status==='done'?'':' ')+'" data-act="goal-done" data-g="'+g.id+'">'+(g.status==='done'?ic('redo',15)+'Reopen goal':ic('check2',15)+'Mark goal as achieved')+'</button></div>'
     +'</section>'}).join('');
  return '<header class="ph"><div><h1>Goals</h1><p class="sub">Break goals into milestones and link your daily tasks to each one</p></div>'
   +'<button class="btn primary" data-act="goal-new">'+ic('plus',17)+'New goal</button></header>'
   +'<div class="tabs" role="tablist">'+tabs.map(t=>'<button class="'+(f===t[0]?'active':'')+'" data-act="goal-filter" data-f="'+t[0]+'" role="tab" aria-selected="'+(f===t[0])+'">'+t[1]+'</button>').join('')+'</div>'
   +(list.length?'<div class="goals">'+cards+'</div>':'<section class="card"><p class="empty">'+(f==='done'?'No completed goals yet':'No goals here yet')+'</p></section>')
   +'<div class="sech"><h2>Challenges with friends</h2><button class="btn sm" data-act="ch-new">'+ic('plus',15)+'New challenge</button></div>'
   +(challenges().length?'<div class="goals">'+challenges().map(challengeCard).join('')+'</div>':'<section class="card"><p class="empty">Start a challenge with a friend — each of you logs your own progress.</p></section>');
};

  ['feelings','How did you feel this week?','Your mood, energy, and state of mind']];

     :'<p class="empty">No reviews yet — start with this week’s</p>')

/* ---------- toast ---------- */
function toast(msg,undo){
  const box=$('#toast');if(!box)return;
  const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');
  const sp=document.createElement('span');sp.textContent=msg;el.appendChild(sp);
  if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();el.remove()};el.appendChild(b)}
  box.appendChild(el);setTimeout(()=>el.remove(),undo?6000:3500);
}

function saveReview(w,extra){
