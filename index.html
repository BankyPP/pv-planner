<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Planner</title>
<meta name="theme-color" content="#F6F7F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F6FDB'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --border:#E4E7EB; --border2:#EEF0F3;
  --ink:#111827; --text:#1F2937; --muted:#6B7280; --faint:#9CA3AF;
  --accent:#2F6FDB; --accent-ink:#1E4FA8; --accent-soft:#EAF1FD;
  --ok:#16803C; --ok-soft:#E7F5EC;
  --hi:#B42318; --hi-soft:#FDECEA; --md:#B45309; --md-soft:#FEF3E2; --lo:#4B5563; --lo-soft:#F1F3F5;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun',system-ui,sans-serif;font-size:15.5px;line-height:1.6;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Kanit',sans-serif;margin:0;line-height:1.35;color:var(--ink)}
h1{font-size:26px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:500}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{flex:none;display:block}
.sub{color:var(--muted);font-size:14.5px}
.fine{color:var(--faint);font-size:13.5px}

/* buttons */
.btn{font-family:'Kanit',sans-serif;font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;line-height:1.3;white-space:nowrap;color:var(--text)}
.btn:hover{background:#F3F4F6}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.danger{color:var(--hi);border-color:#F1C4BE}
.btn.danger:hover{background:var(--hi-soft)}
.btn.danger.solid{background:var(--hi);border-color:var(--hi);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#EEF0F3}
.btn.full{width:100%}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--faint);padding:0;flex:none}
.ibtn:hover{background:#F1F2F4;color:var(--text)}
.link{font-family:'Kanit',sans-serif;font-size:13.5px;font-weight:500;color:var(--accent);background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:var(--accent-ink);text-decoration:underline}

/* inputs */
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{border:1px solid var(--border);border-radius:10px;background:#fff;padding:9px 12px;font-size:15px;width:100%;outline:none;font-family:'Sarabun',sans-serif}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,219,.14)}
textarea{resize:vertical;min-height:84px;line-height:1.6}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{display:block;font-family:'Kanit',sans-serif;font-size:14px;font-weight:500;margin-bottom:6px;color:var(--ink)}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-line{display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer}
.check-line input{width:17px;height:17px;accent-color:var(--accent)}

/* segmented choice */
.seg{display:flex;gap:6px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:1px solid var(--border);border-radius:9px;padding:7px 4px;font-family:'Kanit',sans-serif;font-size:14px;cursor:pointer;background:#fff}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.seg input:checked+span{background:var(--accent-soft);color:var(--accent-ink);border-color:#B9CDF3}
.seg .hi input:checked+span{background:var(--hi-soft);color:var(--hi);border-color:#F1C4BE}
.seg .md input:checked+span{background:var(--md-soft);color:var(--md);border-color:#F4D3A6}
.seg .lo input:checked+span{background:var(--lo-soft);color:var(--lo);border-color:#D5D9DF}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph .sub{margin-top:2px}

/* tags */
.tag{font-family:'Kanit',sans-serif;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;line-height:1.65;white-space:nowrap;display:inline-block}
.tag.hi{background:var(--hi-soft);color:var(--hi)}
.tag.md{background:var(--md-soft);color:var(--md)}
.tag.lo{background:var(--lo-soft);color:var(--lo)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ac{background:var(--accent-soft);color:var(--accent-ink)}
.pdot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:9px}
.pdot.hi{background:#E0675B}.pdot.md{background:#E3A04B}.pdot.lo{background:#B8BEC7}

/* tasks */
.tlist{display:flex;flex-direction:column}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-radius:10px}
.task+.task{border-top:1px solid var(--border2)}
.task:hover{background:#FAFBFC}
.chk{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;border:1.6px solid #C5CAD1;background:#fff;display:grid;place-items:center;color:transparent;padding:0}
.chk:hover{border-color:var(--accent);color:#C5CAD1}
.done>.chk,.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttl{word-break:break-word}
.done .ttl{color:var(--faint);text-decoration:line-through}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:13px;color:var(--muted);align-items:center}
.meta{display:inline-flex;align-items:center;gap:4px}
.meta.late{color:var(--hi)}
.task .ibtn{width:28px;height:28px}
.star.on{color:#D99A00}
.star.on svg{fill:#F5C542;stroke:#D99A00}
.task.compact{padding:5px 2px;gap:8px;font-size:14.5px}
.task.compact .chk{width:18px;height:18px;border-radius:6px;margin-top:3px}
.task.compact .ibtn{width:24px;height:24px}
.num{font-family:'Kanit',sans-serif;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none;margin-top:0}
.sec{font-family:'Kanit',sans-serif;font-size:13.5px;font-weight:500;color:var(--muted);margin:16px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec.late{color:var(--hi)}
.empty{color:var(--faint);font-size:14.5px;padding:10px 4px}

/* quick add */
.qa{display:flex;gap:8px;margin-bottom:6px}
.qa input{flex:1;min-width:0}
.qa select{width:auto;flex:none;padding-right:28px}
.qa.mini{margin:6px 0 0}
.qa.mini input{border-style:dashed;background:transparent;padding:6px 10px;font-size:14px}
.qa.mini input:focus{border-style:solid;background:#fff}

/* progress */
.bar{height:8px;background:#EEF0F3;border-radius:999px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.bar.ok>i{background:var(--ok)}
.prog{display:flex;align-items:center;gap:10px}
.prog .pct{font-family:'Kanit',sans-serif;font-size:13.5px;font-weight:500;color:var(--muted);min-width:42px;text-align:right}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .lbl2{font-family:'Kanit',sans-serif;font-size:13.5px;color:var(--muted)}
.stat .val{font-family:'Kanit',sans-serif;font-size:26px;font-weight:600;line-height:1.25;color:var(--ink)}
.stat .hint{font-size:13px;color:var(--faint)}
.stat.warn .val{color:var(--hi)}
button.stat{text-align:left;width:100%;font:inherit}
button.stat:hover{border-color:#CBD2DB}

/* week rows */
.wrow{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.wrow .wl{color:var(--muted)}
.wrow.today .wl{color:var(--accent);font-weight:700}
.wrow .wc{text-align:right;font-family:'Kanit',sans-serif;font-size:13px;color:var(--muted)}

/* goals */
.goal-mini{padding:10px 0}
.goal-mini+.goal-mini{border-top:1px solid var(--border2)}
.goal-mini .gt{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.goal-mini .gt b{font-weight:700}
.tabs{display:flex;gap:4px;background:#EBEEF2;padding:4px;border-radius:11px;max-width:100%;overflow-x:auto;margin-bottom:16px;width:max-content}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:8px;font-family:'Kanit',sans-serif;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs .active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-items:start}
.gh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.gtitle{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.gdesc{color:var(--muted);font-size:14.5px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.gact{display:flex;gap:2px;flex:none}
.goal .prog{margin:14px 0 6px}
.ms{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--border2)}
.ms .msb{flex:1;min-width:0}
.ms.done>.msb>.ttl{color:var(--faint);text-decoration:line-through}
.ms.done>.chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ms .subtasks{margin-top:4px;padding-left:2px}
.ms .ibtn{width:28px;height:28px}
.ms-head{font-family:'Kanit',sans-serif;font-size:13.5px;font-weight:500;color:var(--muted);margin-top:10px;margin-bottom:2px}

/* weekly */
.wk-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto 1fr;grid-template-areas:"days cal" "days aside";gap:16px;align-items:start}
.wk-cal{grid-area:cal}
.wk-layout>.days{grid-area:days}
.wk-aside{grid-area:aside;display:flex;flex-direction:column;gap:16px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.day{padding:14px;scroll-margin-top:70px}
.day.is-today{border-color:#B9CDF3}
.day.is-sel{box-shadow:0 0 0 2px var(--accent)}
.dh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dh .dn{font-family:'Kanit',sans-serif;font-weight:600;font-size:15px;color:var(--ink)}
.dh .dd{font-size:13.5px;color:var(--muted);margin-left:4px}
.dh .dc{margin-left:auto;font-family:'Kanit',sans-serif;font-size:12.5px;color:var(--muted)}
.is-today .dn{color:var(--accent)}
.navrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.navrow .lab{font-family:'Kanit',sans-serif;font-weight:500;font-size:15px;min-width:150px;text-align:center}
.navrow input[type=date]{width:auto;padding:6px 10px}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{font-family:'Kanit',sans-serif;font-weight:500;font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-wd{font-family:'Kanit',sans-serif;font-size:12px;color:var(--faint);padding:2px 0 4px}
.cal-d{position:relative;height:34px;border:0;background:transparent;border-radius:8px;font-size:14px;padding:0}
.cal-d:hover{background:#EEF0F3}
.cal-d.out{color:#C4C8CE}
.cal-d.inweek{background:var(--accent-soft)}
.cal-d.today{font-weight:700;color:var(--accent)}
.cal-d.sel{background:var(--accent);color:#fff}
.cal-d .dot{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cal-d .dot.alldone{background:var(--ok)}
.cal-d.sel .dot{background:#fff}

/* focus */
.fitem{display:flex;align-items:flex-start;gap:8px;padding:6px 0}
.fitem+.fitem{border-top:1px solid var(--border2)}
.fitem .ft{flex:1;min-width:0;word-break:break-word}
.fitem.done .ft{color:var(--faint);text-decoration:line-through}
.fitem .chk{width:18px;height:18px;border-radius:6px;margin-top:3px}
.fitem .ibtn{width:26px;height:26px}

/* review */
.mood{display:flex;gap:6px;flex-wrap:wrap}
.mood button{flex:1;min-width:72px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 4px;font-family:'Kanit',sans-serif;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.mood button .e{font-size:20px;line-height:1.2}
.mood button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.rv-hist{display:flex;flex-direction:column}
.rv-item{display:block;text-align:left;width:100%;border:0;background:none;padding:10px 8px;border-radius:9px}
.rv-item+.rv-item{border-top:1px solid var(--border2)}
.rv-item:hover{background:#F6F7F9}
.rv-item.on{background:var(--accent-soft)}
.rv-item .t{font-family:'Kanit',sans-serif;font-weight:500;font-size:14.5px;display:flex;justify-content:space-between;gap:6px}
.rv-item .s{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-state{font-size:13px;color:var(--faint)}
.donelist{margin:8px 0 0;padding:0;list-style:none}
.donelist li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;padding:3px 0}
.donelist li .ic{color:var(--ok);margin-top:4px}
.kv{display:flex;gap:18px;flex-wrap:wrap}
.kv div{font-size:14px;color:var(--muted)}
.kv b{font-family:'Kanit',sans-serif;font-size:22px;font-weight:600;color:var(--ink);display:block;line-height:1.3}

/* layout */
.side{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:16px;z-index:10}
.brand{display:flex;align-items:center;gap:9px;font-family:'Kanit',sans-serif;font-weight:600;font-size:17px;color:var(--ink);padding:2px 6px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:0;background:none;font-family:'Kanit',sans-serif;font-size:15px;color:var(--muted);text-align:left;width:100%}
.nav button:hover{background:#F3F4F6;color:var(--text)}
.nav button.active{background:var(--accent-soft);color:var(--accent-ink)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:4px;border-top:1px solid var(--border2);padding-top:12px}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:9px;border:0;background:none;padding:6px;border-radius:9px;text-align:left}
.me:hover{background:#F3F4F6}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.gbtn{padding:11px 14px;font-size:15.5px;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px;margin:16px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--border)}
.avatar{overflow:hidden;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;flex:none}
.me-name{font-family:'Kanit',sans-serif;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{margin-left:236px;padding:28px 32px 56px}
.view{max-width:1120px;margin:0 auto}
.topbar,.bnav,.fab{display:none}

/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.36);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 24px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.16)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mf .spacer{flex:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1F2937;color:#fff;border-radius:10px;padding:10px 14px;font-size:14.5px;display:flex;align-items:center;gap:14px;pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:#9EC0FF;font-family:'Kanit',sans-serif;font-weight:500;padding:0}

/* auth & state screens */
.center-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:410px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px}
.auth-card .brand{padding:0;margin-bottom:22px}
.auth-card h1{font-size:23px;margin-bottom:4px}
.auth-card .sub{margin-bottom:20px}
.err{color:var(--hi);font-size:14px;min-height:0;margin:0 0 10px}
.err:empty{display:none}
.auth-alt{margin-top:16px;text-align:center;font-size:14.5px;color:var(--muted)}
.notice{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.state{max-width:440px;text-align:center;color:var(--muted)}
.state h2{margin-bottom:6px}
.spinner{width:28px;height:28px;border:3px solid #DDE3EA;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:1080px){
  .wk-layout{grid-template-columns:minmax(0,1fr) 270px}
}
@media (max-width:860px){
  body{font-size:15.5px}
  .side{display:none}
  .main{margin-left:0;padding:16px 14px 104px}
  .topbar{display:flex;position:sticky;top:0;z-index:20;background:rgba(246,247,249,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:9px 12px;align-items:center;justify-content:space-between}
  .topbar .brand{font-size:16px;padding:0}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-family:'Kanit',sans-serif;font-size:11.5px;color:var(--muted);padding:3px 0}
  .bnav button.active{color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:0;box-shadow:0 4px 14px rgba(47,111,219,.35);z-index:31}
  .fab.hide{display:none}
  h1{font-size:22px}
  .ph{margin-bottom:14px}
  .grid2{grid-template-columns:minmax(0,1fr)}

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayIso(){return iso(new Date())}
function parse(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function mondayOf(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function monthStart(s){return s.slice(0,8)+'01'}
function addMonths(s,n){const d=parse(monthStart(s));d.setMonth(d.getMonth()+n);return iso(d)}
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_S=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_L=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtShort(s){if(!s)return '';const d=parse(s);return MON_S[d.getMonth()]+' '+d.getDate()}
function fmtDate(s){if(!s)return '';const d=parse(s);return MON_S[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()}
function fmtLong(s){const d=parse(s);return DAYS[d.getDay()]+', '+MON_L[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()}
function dayName(s){return DAYS[parse(s).getDay()]}
function weekLabel(mon){const a=parse(mon),b=parse(addDays(mon,6));
  if(a.getMonth()===b.getMonth())return MON_S[a.getMonth()]+' '+a.getDate()+'–'+b.getDate()+', '+b.getFullYear();
  if(a.getFullYear()===b.getFullYear())return MON_S[a.getMonth()]+' '+a.getDate()+' – '+MON_S[b.getMonth()]+' '+b.getDate()+', '+b.getFullYear();
  return fmtDate(mon)+' – '+fmtDate(addDays(mon,6))}
function stable(v){if(v===null||typeof v!=='object')return JSON.stringify(v);
  if(Array.isArray(v))return '['+v.map(stable).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}'}
const isMobile=()=>window.matchMedia('(max-width:860px)').matches;

/* ---------- icons ---------- */
const IC={
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',

 plus:'<path d="M12 5v14M5 12h14"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',

 left:'<path d="m15 18-6-6 6-6"/>',

 star:'<path d="m12 3.2 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
 logout:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
 note:'<path d="M6 3.5h12v17H6z"/><path d="M9 8.5h6M9 12h6M9 15.5h3"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
 check2:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/>',
 redo:'<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>'
};
const ic=(n,s)=>{s=s||18;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'};

const PRIO={high:{l:'High',c:'hi',r:0},medium:{l:'Medium',c:'md',r:1},low:{l:'Low',c:'lo',r:2}};
const pr=t=>PRIO[t.priority]||PRIO.medium;
const MOODS=[[1,'😣','Awful'],[2,'🙁','Not great'],[3,'😐','Okay'],[4,'🙂','Good'],[5,'😄','Great']];
const ROUTES=['dashboard','daily','weekly','goals','review','account'];
const NAV=[['dashboard','Dashboard','Home','home'],['daily','Daily Planner','Daily','sun'],['weekly','Weekly Planner','Weekly','cal'],['goals','Goals','Goals','target'],['review','Weekly Review','Review','book'],['account','Settings','Settings','gear']];

/* ---------- state ---------- */
const T0=todayIso();
const S={mode:'loading',col:null,uid:null,profile:null,
  tasks:new Map(),goals:new Map(),focus:new Map(),reviews:new Map(),
  route:'dashboard',dailyDate:T0,weekStart:mondayOf(T0),weekSel:T0,calMonth:monthStart(T0),reviewWeek:mondayOf(T0),
  goalFilter:'active',drafts:{},deleting:false,loadTimer:null,rvTimer:null,user:null,unsub:null,authError:'',authView:'signin',pendingName:''};
/* Firebase project pv-planner; planner data lives at users/{uid}/planner/{doc} */
const FB_VERSION='10.12.2';
const FIREBASE={ /* paste the firebaseConfig values from Firebase Console → Project settings → Your apps */
  apiKey:'AIzaSyD-LC4OMfyyVR4KPTYB-aYLnIXwnEPNtMA',authDomain:'pv-planner-96e2b.firebaseapp.com',projectId:'pv-planner-96e2b',storageBucket:'pv-planner-96e2b.firebasestorage.app',messagingSenderId:'300153420589',appId:'1:300153420589:web:c05d70fe70487fa7f071a4'};
const PLANNER_PATH=uid=>['users',uid,'planner'];
let FB=null;

/* ---------- storage (db) ---------- */
const Q={};
function enqueue(id,fn){
  const run=async()=>{
    try{await fn()}
    catch(e){
      if(e&&(e.code==='unavailable'||e.code==='deadline-exceeded')){await sleep(400+Math.random()*800);try{await fn();return}catch(e2){writeErr(e2);throw e2}}
      writeErr(e);throw e;
    }
  };
  const p=(Q[id]||Promise.resolve()).catch(()=>{}).then(run);
  Q[id]=p;
  return p.then(()=>true,()=>false);
}
function save(id,data){return enqueue(id,()=>S.col.doc(id).set(data))}
function removeDoc(id){return enqueue(id,()=>S.col.doc(id).delete())}
function writeErr(e){
  const c=e&&e.code;
  console.warn('write failed',e);
  toast(c==='permission-denied'?'Couldn’t save — no permission to write (check the Firestore rules)'
    :c==='resource-exhausted'?'Saving too often — wait a moment and try again'
    :c==='invalid-argument'?'Invalid data — couldn’t save':'Couldn’t save — please try again');
}
const strip=o=>{const c=Object.assign({},o);delete c.id;return c};

/* tasks */
const allTasks=()=>[...S.tasks.values()];
const tasksOn=d=>allTasks().filter(t=>t.date===d);
function tasksInWeek(mon){const end=addDays(mon,6);return allTasks().filter(t=>t.date>=mon&&t.date<=end)}
const sortTasks=(a,b)=>(!!b.star-!!a.star)||(pr(a).r-pr(b).r)||((a.createdAt||0)-(b.createdAt||0));
function addTask(o){
  const id='t_'+rid(),now=Date.now();
  const t={title:o.title,date:o.date||todayIso(),priority:o.priority||'medium',notes:o.notes||'',star:!!o.star,
    goalId:o.goalId||null,msId:o.msId||null,done:false,doneAt:null,createdAt:now,updatedAt:now};
  S.tasks.set(id,Object.assign({},t,{id}));render();save(id,t);return id;
}
function patchTask(id,patch){
  const cur=S.tasks.get(id);if(!cur)return;
  const next=Object.assign(strip(cur),patch,{updatedAt:Date.now()});
  S.tasks.set(id,Object.assign({},next,{id}));render();save(id,next);
}
function toggleTask(id){const t=S.tasks.get(id);if(t)patchTask(id,{done:!t.done,doneAt:t.done?null:Date.now()})}
function deleteTask(id){
  const cur=S.tasks.get(id);if(!cur)return;
  S.tasks.delete(id);render();removeDoc(id);
  toast('Deleted “'+cur.title+'”',()=>{S.tasks.set(id,cur);render();save(id,strip(cur))});
}

/* goals */
const allGoals=()=>[...S.goals.values()].sort((a,b)=>(a.targetDate||'9999')<(b.targetDate||'9999')?-1:(a.targetDate||'9999')>(b.targetDate||'9999')?1:(a.createdAt||0)-(b.createdAt||0));
const activeGoals=()=>allGoals().filter(g=>g.status!=='done');
const linked=(gid,mid)=>allTasks().filter(t=>t.goalId===gid&&t.msId===mid).sort((a,b)=>(a.done-b.done)||(a.date<b.date?-1:1));
function msProgress(g,m){if(m.done)return 1;const lt=linked(g.id,m.id);if(!lt.length)return 0;return lt.filter(t=>t.done).length/lt.length}
function goalProgress(g){if(g.status==='done')return 1;const ms=g.milestones||[];if(!ms.length)return 0;return ms.reduce((s,m)=>s+msProgress(g,m),0)/ms.length}
function msLabel(gid,mid){const g=S.goals.get(gid);if(!g)return '';const m=(g.milestones||[]).find(x=>x.id===mid);return m?m.title:g.title}
function saveGoal(g){const id=g.id;const d=strip(clone(g));d.updatedAt=Date.now();S.goals.set(id,Object.assign({},d,{id}));render();return save(id,d)}

/* focus */
function focusItems(mon){const f=S.focus.get('f_'+mon);return f&&f.items?clone(f.items):[]}
function saveFocus(mon,items){const id='f_'+mon;const d={week:mon,items,updatedAt:Date.now()};S.focus.set(id,Object.assign({},d,{id}));render();return save(id,d)}

/* ---------- snapshot ---------- */
function sig(){const f=m=>[...m.values()].sort((a,b)=>a.id<b.id?-1:1);return stable([S.profile,f(S.tasks),f(S.goals),f(S.focus),f(S.reviews)])}
function onSnap(snap){
  clearTimeout(S.loadTimer);
  if(S.deleting)return;
  const before=S.mode==='app'?sig():'';
  const n={tasks:new Map(),goals:new Map(),focus:new Map(),reviews:new Map(),profile:null};
  snap.docs.forEach(d=>{
    const v=d.data();if(!v)return;const id=d.id;
    if(id==='profile')n.profile=v;
    else if(id.startsWith('t_'))n.tasks.set(id,Object.assign({},v,{id}));
    else if(id.startsWith('g_'))n.goals.set(id,Object.assign({},v,{id}));
    else if(id.startsWith('f_'))n.focus.set(id,Object.assign({},v,{id}));
    else if(id.startsWith('r_'))n.reviews.set(id,Object.assign({},v,{id}));
  });
  S.tasks=n.tasks;S.goals=n.goals;S.focus=n.focus;S.reviews=n.reviews;
  const definitive=!snap.metadata.fromCache;
  if(n.profile)S.profile=n.profile;
  else if(definitive||S.mode==='app'){if(!S.profile||S.profile.uid!==S.user.uid)createProfile()}
  else return; /* cached and empty: wait for the server */
  if(S.mode!=='app'){enterApp();return}
  if(sig()!==before)render();
}
function createProfile(){
  const u=S.user;
  const prof={uid:u.uid,name:(S.pendingName||u.displayName||(u.email||'').split('@')[0]||'there'),email:u.email||'',createdAt:Date.now()};S.pendingName='';
  S.profile=prof;save('profile',prof);
}
function onSnapErr(e){
  clearTimeout(S.loadTimer);

  if(c==='permission-denied')stateScreen('No access to your data yet','The Firestore security rules don’t allow users/{uid}/planner yet. Add the rules from this site’s README, then reload.',false,true);
  else stateScreen('Couldn’t connect to your data','Check your internet connection, then reload the page.',false,true);
}

/* ---------- boot (Firebase) ---------- */
function stateScreen(title,msg,spin,withLogout){
  if(S.mode==='app'&&!withLogout){toast(title+' — '+msg);return}
  S.mode='blocked';
  $('#root').innerHTML='<div class="center-wrap"><div class="state">'+(spin?'<div class="spinner"></div>':'')+'<h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p>'
   +(withLogout?'<p style="margin-top:16px"><button class="btn" data-act="logout">'+ic('logout',16)+'Sign out</button></p>':'')+'</div></div>';
}
function loadingScreen(msg){S.mode='loading';$('#root').innerHTML='<div class="center-wrap"><div class="state"><div class="spinner"></div><p>'+esc(msg)+'</p></div></div>'}
async function boot(){
  if(!FIREBASE.apiKey){stateScreen('Setup needed','Add the Firebase config to index.html to start using Personal Planner.');return}
  try{
    const b='https://www.gstatic.com/firebasejs/'+FB_VERSION+'/';
    const [ap,au,fs]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
    const app=ap.initializeApp(FIREBASE,'pv-planner'); /* own app name = own sign-in, separate from the other sites on bankypp.github.io */
    let db;
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()}),ignoreUndefinedProperties:true})}
    catch(e){db=fs.getFirestore(app)}
    FB={au,fs,auth:au.getAuth(app),db};
    try{await au.setPersistence(FB.auth,au.browserLocalPersistence)}catch(e){}
    au.getRedirectResult(FB.auth).catch(e=>{S.authError=authMsg(e);if(S.mode==='auth')showLogin(S.authView)});
    au.onAuthStateChanged(FB.auth,u=>{
      if(S.unsub){S.unsub();S.unsub=null}
      S.tasks=new Map();S.goals=new Map();S.focus=new Map();S.reviews=new Map();S.profile=null;S.drafts={};
      if(!u){S.user=null;S.col=null;showLogin(S.authView==='signup'?'signup':'signin');return}
      S.user=u;S.authView='signin';S.authError='';
      const colRef=fs.collection(FB.db,...PLANNER_PATH(u.uid));
      S.col={doc:id=>({set:d=>fs.setDoc(fs.doc(colRef,id),d),delete:()=>fs.deleteDoc(fs.doc(colRef,id))})};
      loadingScreen('Loading your planner…');
      S.loadTimer=setTimeout(()=>{const p=$('#root .state p');if(S.mode==='loading'&&p)p.textContent='Still connecting — check your internet. The page will continue on its own once it connects.'},10000);
      S.unsub=fs.onSnapshot(colRef,onSnap,onSnapErr);
    });
  }catch(e){
    console.error(e);
    stateScreen('Couldn’t load the app','Check your internet connection, then reload the page.');
  }
}
function authMsg(e){
  const c=(e&&e.code)||'';
  const bad='Incorrect email or password.';
  const M={'auth/popup-closed-by-user':'','auth/cancelled-popup-request':'',
    'auth/invalid-credential':bad,'auth/wrong-password':bad,'auth/user-not-found':bad,'auth/invalid-login-credentials':bad,
    'auth/invalid-email':'That email address doesn’t look right.','auth/missing-password':'Please enter your password.',
    'auth/email-already-in-use':'An account with this email already exists. Sign in instead — or use “Continue with Google” if you signed up with Google.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/too-many-requests':'Too many attempts. Please wait a few minutes and try again.',
    'auth/network-request-failed':'Can’t reach the internet. Please try again.',
    'auth/unauthorized-domain':'This domain isn’t authorized in Firebase yet (Authentication → Settings → Authorized domains).',
    'auth/operation-not-allowed':'This sign-in method isn’t enabled in Firebase yet (Authentication → Sign-in method).',
    'auth/account-exists-with-different-credential':'This email already uses a different sign-in method.',

  return Object.prototype.hasOwnProperty.call(M,c)?M[c]:'Sign-in failed ('+(c||'unknown error')+').';
}
function setAuthErr(m){S.authError=m||'';const er=$('#auth-err');if(er)er.textContent=S.authError}
async function googleLogin(btn){
  const A=FB.au,p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});

}

const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

/* ---------- login screen ---------- */

const GLOGO='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';

  }else if(view==='reset'){
    h='<h1>Reset your password</h1><p class="sub">Enter the email you signed up with and we’ll send you a link to set a new password.</p>'

async function doSignin(f){
  const el=f.elements,email=el.em.value.trim(),pw=el.pw.value;
  if(!emailOk(email))return setAuthErr('Please enter a valid email address.');
  if(!pw)return setAuthErr('Please enter your password.');
  setAuthErr('');busy(f,true);
  try{await FB.au.signInWithEmailAndPassword(FB.auth,email,pw)}catch(e){busy(f,false);setAuthErr(authMsg(e))}
}
async function doSignup(f){
  const el=f.elements,name=el.nm.value.trim(),email=el.em.value.trim(),pw=el.pw.value,pw2=el.pw2.value;
  if(!name)return setAuthErr('Please enter your name.');
  if(!emailOk(email))return setAuthErr('Please enter a valid email address.');
  if(pw.length<6)return setAuthErr('Password must be at least 6 characters.');
  if(pw!==pw2)return setAuthErr('Passwords don’t match.');
  setAuthErr('');busy(f,true);S.pendingName=name;
  try{const cred=await FB.au.createUserWithEmailAndPassword(FB.auth,email,pw);try{await FB.au.updateProfile(cred.user,{displayName:name})}catch(e){}}
  catch(e){S.pendingName='';busy(f,false);setAuthErr(authMsg(e))}
}
async function doReset(f){
  const email=f.elements.em.value.trim();
  if(!emailOk(email))return setAuthErr('Please enter a valid email address.');
  setAuthErr('');busy(f,true);
  try{await FB.au.sendPasswordResetEmail(FB.auth,email);showLogin('signin','If an account exists for '+email+', a reset link is on its way. Check your inbox (and spam folder).')}
  catch(e){busy(f,false);setAuthErr(authMsg(e))}
}

function render(){
  if(S.mode!=='app')return;
  const view=$('#view');if(!view)return;
  S.rendering=true;
  const ae=document.activeElement;let fk=null,ss=null,se=null,st=0;
  if(ae&&ae.dataset&&ae.dataset.k&&view.contains(ae)){fk=ae.dataset.k;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}st=ae.scrollTop}
  try{view.innerHTML=(VIEWS[S.route]||VIEWS.dashboard)()}finally{S.rendering=false}
  view.querySelectorAll('[data-k]').forEach(el=>{if(Object.prototype.hasOwnProperty.call(S.drafts,el.dataset.k))el.value=S.drafts[el.dataset.k]});
  if(fk){const el=[...view.querySelectorAll('[data-k]')].find(x=>x.dataset.k===fk);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}el.scrollTop=st}}
  document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===S.route));
  const nm=(S.profile&&S.profile.name)||'';
  const a=$('#me-av'),n=$('#me-name');if(n)n.textContent=nm;
  if(a&&!a.dataset.set){a.dataset.set='1';const ph=S.user&&S.user.photoURL;
    if(ph){const im=document.createElement('img');im.src=ph;im.alt='';im.referrerPolicy='no-referrer';im.onerror=()=>{a.textContent=(nm.trim()[0]||'?').toUpperCase()};a.appendChild(im)}
    else a.textContent=(nm.trim()[0]||'?').toUpperCase()}
  const fab=$('.fab');if(fab)fab.classList.toggle('hide',!['daily','weekly'].includes(S.route));
}

function miniCal(){
  const m=S.calMonth,first=parse(m),start=mondayOf(m),td=todayIso(),ws=S.weekStart,we=addDays(ws,6);
  const counts={};allTasks().forEach(t=>{const c=counts[t.date]||(counts[t.date]={n:0,d:0});c.n++;if(t.done)c.d++});
  let cells='';
  for(let i=0;i<42;i++){const d=addDays(start,i),dd=parse(d);const c=counts[d];
    const cls=['cal-d'];if(dd.getMonth()!==first.getMonth())cls.push('out');if(d>=ws&&d<=we)cls.push('inweek');if(d===td)cls.push('today');if(d===S.weekSel)cls.push('sel');
    cells+='<button class="'+cls.join(' ')+'" data-act="cal-pick" data-date="'+d+'" aria-label="'+fmtLong(d)+'">'+dd.getDate()+(c?'<span class="dot'+(c.d===c.n?' alldone':'')+'"></span>':'')+'</button>';
    if(i>=34&&parse(addDays(start,i+1)).getMonth()!==first.getMonth()&&(i+1)%7===0)break;
  }
  return '<section class="card"><div class="cal-h"><button class="ibtn" data-act="cal-prev" aria-label="Previous month">'+ic('left',17)+'</button><b>'+MON_L[first.getMonth()]+' '+first.getFullYear()+'</b><button class="ibtn" data-act="cal-next" aria-label="Next month">'+ic('right',17)+'</button></div>'
   +'<div class="cal-grid">'+['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>'<span class="cal-wd">'+x+'</span>').join('')+cells+'</div></section>';
}

}

   +'<div class="field"><label class="lbl" for="m-notes">Notes</label><textarea id="m-notes" name="notes" rows="3" placeholder="Optional">'+esc(t.notes||'')+'</textarea></div>'
   +'<label class="check-line"><input type="checkbox" name="star"'+(t.star?' checked':'')+'> Star as important (shown first in Top 3)</label>'
   +(id?'<label class="check-line" style="margin-top:8px"><input type="checkbox" name="done"'+(t.done?' checked':'')+'> Done</label>':'')
   +'<div class="mf">'+(id?'<button type="button" class="btn danger" data-act="modal-del-task" data-id="'+id+'">'+ic('trash',16)+'Delete</button><span class="spacer"></span>':'')

/* ---------- toast ---------- */
function toast(msg,undo){
  const box=$('#toast');if(!box)return;
  const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');
  const sp=document.createElement('span');sp.textContent=msg;el.appendChild(sp);
  if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();el.remove()};el.appendChild(b)}
  box.appendChild(el);setTimeout(()=>el.remove(),undo?6000:3500);
}

/* ---------- review saving ---------- */
function saveReview(w,extra){
  const id='r_'+w,base=Object.assign({},S.reviews.get(id)||{});delete base.id;
  const doc={week:w,mood:base.mood||null};
  RV_FIELDS.forEach(f=>{const k='rv-'+w+'-'+f[0];doc[f[0]]=Object.prototype.hasOwnProperty.call(S.drafts,k)?S.drafts[k]:(base[f[0]]||'');delete S.drafts[k]});
  Object.assign(doc,extra||{});doc.updatedAt=Date.now();doc.createdAt=base.createdAt||doc.updatedAt;
  S.reviews.set(id,Object.assign({},doc,{id}));
  const st=$('#rv-status');if(st)st.textContent='Saving…';
  save(id,doc).then(ok=>{const s=$('#rv-status');if(s)s.textContent=ok?'Saved':'Couldn’t save'});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,td=todayIso();
  if(el.tagName==='INPUT')return;
  switch(a){
    case 'bg-close':if(e.target===el)closeModal();return;
    case 'close-modal':closeModal();return;
    case 'google-login':if(FB)googleLogin(el);return;
    case 'auth-view':setAuthErr('');showLogin(el.dataset.v);return;
    case 'pw-reset-email':{const em=S.user&&S.user.email;if(!em)return;FB.au.sendPasswordResetEmail(FB.auth,em).then(()=>toast('Password reset email sent to '+em),e=>toast(authMsg(e)));return}
    case 'nav':closeModal();go(el.dataset.route);return;
    case 'logout':closeModal();if(FB)FB.au.signOut(FB.auth);return;
    case 'new-task':openTaskModal(null,{date:S.route==='daily'?S.dailyDate:S.route==='weekly'?S.weekSel:td});return;
    case 'toggle':toggleTask(id);return;
    case 'star':{const t=S.tasks.get(id);if(t)patchTask(id,{star:!t.star});return}
    case 'del':deleteTask(id);return;
    case 'edit':openTaskModal(id);return;
    case 'modal-del-task':closeModal();deleteTask(id);return;
    case 'move-today':patchTask(id,{date:td});return;
    case 'move-all-today':allTasks().filter(t=>!t.done&&t.date<td).forEach(t=>patchTask(t.id,{date:td}));toast('Moved all overdue tasks to today');return;
    case 'day-prev':S.dailyDate=addDays(S.dailyDate,-1);render();return;
    case 'day-next':S.dailyDate=addDays(S.dailyDate,1);render();return;
    case 'day-today':S.dailyDate=td;render();return;
    case 'wk-prev':case 'wk-next':case 'wk-this':{
      S.weekStart=a==='wk-this'?mondayOf(td):addDays(S.weekStart,a==='wk-prev'?-7:7);
      S.weekSel=a==='wk-this'?td:addDays(S.weekSel,a==='wk-prev'?-7:7);S.calMonth=monthStart(addDays(S.weekStart,3));render();return}
    case 'cal-prev':S.calMonth=addMonths(S.calMonth,-1);render();return;
    case 'cal-next':S.calMonth=addMonths(S.calMonth,1);render();return;
    case 'cal-pick':{const d=el.dataset.date;S.weekSel=d;S.weekStart=mondayOf(d);S.calMonth=monthStart(d);render();
      requestAnimationFrame(()=>{const c=document.getElementById('day-'+d);if(c&&isMobile())c.scrollIntoView({behavior:'smooth',block:'start'})});return}
    case 'open-day':S.dailyDate=el.dataset.date;go('daily');return;
    case 'focus-toggle':{const w=el.dataset.w,items=focusItems(w),it=items.find(x=>x.id===el.dataset.i);if(it){it.done=!it.done;saveFocus(w,items)}return}
    case 'focus-del':{const w=el.dataset.w;saveFocus(w,focusItems(w).filter(x=>x.id!==el.dataset.i));return}
    case 'goal-new':openGoalModal(null);return;
    case 'goal-edit':openGoalModal(el.dataset.g);return;
    case 'goal-filter':S.goalFilter=el.dataset.f;render();return;
    case 'goal-done':{const g=clone(S.goals.get(el.dataset.g));if(!g)return;const was=g.status==='done';g.status=was?'active':'done';g.doneAt=was?null:Date.now();saveGoal(g);if(!was)toast('Congrats! You achieved “'+g.title+'”');return}
    case 'goal-del':{const g=S.goals.get(el.dataset.g);if(!g)return;
      confirmModal('Delete this goal?','“'+esc(g.title)+'” and all its milestones will be deleted. Linked tasks stay in your planner but will no longer be linked.','Delete goal',()=>{
        allTasks().filter(t=>t.goalId===g.id).forEach(t=>patchTask(t.id,{goalId:null,msId:null}));
        S.goals.delete(g.id);render();removeDoc(g.id);toast('Goal deleted')});return}
    case 'ms-toggle':{const g=clone(S.goals.get(el.dataset.g));if(!g)return;const m=(g.milestones||[]).find(x=>x.id===el.dataset.m);if(m){m.done=!m.done;saveGoal(g)}return}
    case 'ms-edit':openMsModal(el.dataset.g,el.dataset.m);return;
    case 'ms-del':{const g=clone(S.goals.get(el.dataset.g));if(!g)return;const mid=el.dataset.m;const m=(g.milestones||[]).find(x=>x.id===mid);if(!m)return;
      confirmModal('Delete this milestone?','“'+esc(m.title)+'” will be deleted. Linked tasks stay in your planner.','Delete',()=>{
        allTasks().filter(t=>t.goalId===g.id&&t.msId===mid).forEach(t=>patchTask(t.id,{goalId:null,msId:null}));
        g.milestones=g.milestones.filter(x=>x.id!==mid);saveGoal(g)});return}
    case 'ms-addtask':openTaskModal(null,{date:td,goalId:el.dataset.g,msId:el.dataset.m});return;
    case 'confirm-ok':{const fn=S.confirmFn;closeModal();if(fn)fn();return}
    case 'rv-prev':case 'rv-next':case 'rv-this':
      S.reviewWeek=a==='rv-this'?mondayOf(td):addDays(S.reviewWeek,a==='rv-prev'?-7:7);render();return;
    case 'rv-open':S.reviewWeek=el.dataset.w;render();window.scrollTo(0,0);return;
    case 'mood':{const w=el.dataset.w,v=Number(el.dataset.v),cur=S.reviews.get('r_'+w);saveReview(w,{mood:cur&&cur.mood===v?null:v});render();return}
    case 'rv-push':{
      const w=el.dataset.w,k='rv-'+w+'-nextFocus',r=S.reviews.get('r_'+w)||{};
      const txt=Object.prototype.hasOwnProperty.call(S.drafts,k)?S.drafts[k]:(r.nextFocus||'');
      const lines=txt.split('\n').map(s=>s.replace(/^\s*([-•*]|\d+[.)])\s*/,'').trim()).filter(Boolean);
      if(!lines.length){toast('Write something in “What do you want to focus on next week?” first');return}
      if(Object.prototype.hasOwnProperty.call(S.drafts,k))saveReview(w);
      const nw=addDays(w,7),items=focusItems(nw),have=new Set(items.map(i=>i.text));let n=0;
      lines.forEach(t=>{if(!have.has(t)){items.push({id:rid(),text:t,done:false});have.add(t);n++}});
      if(n)saveFocus(nw,items);
      toast(n?'Added '+n+(n===1?' item':' items')+' to the focus for '+weekLabel(nw):'Everything is already in next week’s focus');return}
    case 'copy-json':{
      const p=S.profile||{};const strip2=m=>[...m.values()];
      const data=JSON.stringify({exportedAt:new Date().toISOString(),profile:{name:p.name,email:p.email,createdAt:p.createdAt},tasks:strip2(S.tasks),goals:strip2(S.goals),weeklyFocus:strip2(S.focus),weeklyReviews:strip2(S.reviews)},null,2);
      const fallback=()=>openModal(mHead('All data (JSON)')+'<p class="sub" style="margin-bottom:10px">Copy the text below to keep it</p><textarea readonly rows="12" style="font-family:monospace;font-size:12.5px">'+esc(data)+'</textarea><div class="mf"><button class="btn" data-act="close-modal">Close</button></div>');
      try{navigator.clipboard.writeText(data).then(()=>toast('Copied to clipboard'),fallback)}catch(err){fallback()}
      return}
    case 'delete-all':
      openModal(mHead('Delete all data?')+'<form data-form="delete-all" novalidate><p class="sub" style="margin-bottom:12px">Everything will be deleted permanently. Type <b>DELETE</b> to confirm.</p>'
        +'<div class="field"><input type="text" name="cf" autofocus autocomplete="off" aria-label="Type DELETE to confirm"></div><p class="err" id="del-err"></p>'
        +'<div class="mf"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn danger solid">Delete everything</button></div></form>');
      return;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.act==='pick-day'&&el.value){S.dailyDate=el.value;render()}
});
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.k)return;
  S.drafts[el.dataset.k]=el.value;
  if(el.dataset.rv){const w=el.dataset.w;const st=$('#rv-status');if(st)st.textContent='Typing…';
    clearTimeout(S.rvTimer);S.rvTimer=setTimeout(()=>saveReview(w),800)}
});
document.addEventListener('focusout',e=>{
  const el=e.target;if(S.rendering||!el.isConnected)return;if(el.dataset&&el.dataset.rv&&Object.prototype.hasOwnProperty.call(S.drafts,el.dataset.k)){clearTimeout(S.rvTimer);saveReview(el.dataset.w)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal()});
document.addEventListener('submit',async e=>{
  const f=e.target;const kind=f.dataset&&f.dataset.form;if(!kind)return;e.preventDefault();
  const el=f.elements;
  switch(kind){
    case 'signin':return doSignin(f);
    case 'signup':return doSignup(f);
    case 'reset':return doReset(f);
    case 'qa':{
      const key=f.dataset.key,title=el.title.value.trim();if(!title){el.title.focus();return}
      const prio=el.prio?el.prio.value:'medium';
      delete S.drafts[key];el.title.value='';
      addTask({title,date:f.dataset.date,priority:prio});return}
    case 'focus-add':{
      const key=f.dataset.key,text=el.text.value.trim();if(!text)return;
      delete S.drafts[key];el.text.value='';
      const w=f.dataset.w,items=focusItems(w);items.push({id:rid(),text,done:false});saveFocus(w,items);return}
    case 'ms-add':{
      const key=f.dataset.key,title=el.title.value.trim();if(!title)return;
      delete S.drafts[key];el.title.value='';
      const g=clone(S.goals.get(f.dataset.g));if(!g)return;g.milestones=g.milestones||[];g.milestones.push({id:rid(),title,done:false,due:''});saveGoal(g);return}
    case 'task':{
      const id=f.dataset.id,title=el.title.value.trim();if(!title){el.title.focus();return}
      const parts=(el.ms.value||'').split('|');
      const data={title,date:el.date.value||todayIso(),priority:el.prio.value||'medium',notes:el.notes.value.trim(),star:el.star.checked,goalId:parts[0]||null,msId:parts[1]||null};
      if(id){const t=S.tasks.get(id);if(el.done&&t&&el.done.checked!==!!t.done){data.done=el.done.checked;data.doneAt=el.done.checked?Date.now():null}patchTask(id,data)}
      else addTask(data);
      closeModal();return}
    case 'goal':{
      const id=f.dataset.id,title=el.gt.value.trim();if(!title){$('#goal-err').textContent='Please give your goal a name';el.gt.focus();return}
      const base={title,description:el.gd.value.trim(),horizon:el.gh.value||'short',targetDate:el.gdate.value||''};
      if(id){const g=clone(S.goals.get(id));if(!g)return;Object.assign(g,base);saveGoal(g)}
      else{const now=Date.now();const ms=(el.gms?el.gms.value:'').split('\n').map(s=>s.replace(/^\s*([-•*]|\d+[.)])\s*/,'').trim()).filter(Boolean).map(t=>({id:rid(),title:t,done:false,due:''}));
        saveGoal(Object.assign({id:'g_'+rid(),status:'active',milestones:ms,createdAt:now},base));S.goalFilter='active'}
      closeModal();if(S.route!=='goals')go('goals');return}
    case 'ms-edit':{
      const g=clone(S.goals.get(f.dataset.g));if(!g)return;const m=(g.milestones||[]).find(x=>x.id===f.dataset.m);if(!m)return;
      const t=el.mt.value.trim();if(!t){el.mt.focus();return}m.title=t;m.due=el.md.value||'';saveGoal(g);closeModal();return}
    case 'profile':{
      const name=el.nm.value.trim(),err=$('#prof-err');
      if(!name){err.textContent='Please enter a name';return}
      err.textContent='';delete S.drafts['set-nm'];
      const prof=Object.assign(clone(S.profile),{name,updatedAt:Date.now()});S.profile=prof;render();
      if(await save('profile',prof))toast('Profile saved');return}
    case 'delete-all':{
      if(el.cf.value.trim().toUpperCase()!=='DELETE'){$('#del-err').textContent='Type DELETE to confirm';return}
      busy(f,true);S.deleting=true;
      const ids=[...S.tasks.keys(),...S.goals.keys(),...S.focus.keys(),...S.reviews.keys()];
      let ok=true;for(const id of ids){if(!(await removeDoc(id)))ok=false}
      if(ok)ok=await removeDoc('profile');
      S.deleting=false;closeModal();
      if(ok){toast('All data deleted');FB.au.signOut(FB.auth)}
      else toast('Some data couldn’t be deleted — please try again');
      return}
  }
});

boot();
})();
</script>
</body>
</html>
